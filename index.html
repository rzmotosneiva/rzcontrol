<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RZ Rentas Control</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0; padding:0; background:var(--bg,#FAF6EC);}
#app{display:none;}
.login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box;}
.login-card{width:100%; max-width:360px; background:var(--surface,#fff); border:1px solid var(--border,#E7DAB8); border-radius:16px; padding:28px 24px; box-sizing:border-box;}
.login-card .mark{width:44px; height:44px; border-radius:12px; background:var(--accent-strong,#6E4E07); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-weight:700; font-size:18px; margin-bottom:14px;}
.login-card h1{font-family:'Oswald',sans-serif; font-size:20px; margin:0 0 4px;}
.login-card p{font-size:13px; color:var(--text-muted,#7A6F52); margin:0 0 18px;}
.login-card .seg{display:flex; gap:8px; margin-bottom:14px;}
.login-card .seg button{flex:1; padding:9px; border-radius:9px; border:1px solid var(--border,#E7DAB8); background:var(--surface-2,#F3E6C7); font-size:13px; cursor:pointer;}
.login-card .seg button.active{background:var(--accent-strong,#6E4E07); color:#fff; border-color:var(--accent-strong,#6E4E07);}
.login-card input{width:100%; box-sizing:border-box; padding:11px 12px; border-radius:9px; border:1px solid var(--border,#E7DAB8); font-size:14px; margin-bottom:12px; background:var(--surface,#fff); color:var(--text,#221C10);}
.login-card button.submit{width:100%; padding:12px; border-radius:10px; border:none; background:var(--accent-strong,#6E4E07); color:#fff; font-size:14px; font-weight:600; cursor:pointer;}
.login-card .err{color:var(--danger,#B3261E); font-size:12.5px; margin:-4px 0 12px; min-height:16px;}
#claveBtn{background:none; border:none; color:var(--text-muted,#7A6F52); cursor:pointer; padding:6px; flex:none;}
#logoutBtn{background:none; border:none; color:var(--text-muted,#7A6F52); cursor:pointer; padding:6px; flex:none;}
:root{
  --bg:#FAF6EC; --surface:#FFFFFF; --surface-2:#F3E6C7; --border:#E7DAB8;
  --text:#221C10; --text-muted:#7A6F52;
  --accent:#9C6F0A; --accent-strong:#6E4E07; --accent-contrast:#FFFFFF; --accent-soft:#F7EBCB;
  --success:#1F7A43; --success-bg:#E4F3E9;
  --warning:#8A5A00; --warning-bg:#FBF0D9;
  --danger:#B3261E; --danger-bg:#FBE7E5;
  --radius:14px;
  color-scheme:light;
  font-variant-numeric: tabular-nums;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131107; --surface:#1D190F; --surface-2:#2B2412; --border:#3C331A;
    --text:#F3EEDD; --text-muted:#B3A688;
    --accent:#E5B93C; --accent-strong:#F2CB66; --accent-contrast:#171205; --accent-soft:#332912;
    --success:#5FCB84; --success-bg:#173321;
    --warning:#E5B93C; --warning-bg:#33290C;
    --danger:#FF8A80; --danger-bg:#3A1815;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131107; --surface:#1D190F; --surface-2:#2B2412; --border:#3C331A;
  --text:#F3EEDD; --text-muted:#B3A688;
  --accent:#E5B93C; --accent-strong:#F2CB66; --accent-contrast:#171205; --accent-soft:#332912;
  --success:#5FCB84; --success-bg:#173321;
  --warning:#E5B93C; --warning-bg:#33290C;
  --danger:#FF8A80; --danger-bg:#3A1815;
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--text); font-family:'Work Sans',system-ui,sans-serif; padding-inline:0;}
h1,h2,h3{font-family:'Oswald',system-ui,sans-serif; text-transform:uppercase; letter-spacing:.02em; text-wrap:balance; margin:0;}
button{font-family:inherit;}
#app{display:flex; flex-direction:column; min-height:100%;}

.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  display:flex; align-items:center; gap:10px;
  padding:12px 16px; background:var(--surface); border-bottom:1px solid var(--border);
}
.mark{
  width:34px; height:34px; border-radius:9px; flex:none;
  background:linear-gradient(155deg,#1A1508,#000);
  display:flex; align-items:center; justify-content:center;
  font-family:'Oswald',sans-serif; font-weight:700; font-size:14px; color:var(--accent-strong);
  border:1px solid var(--border);
}
.brand-text{display:flex; flex-direction:column; line-height:1.1;}
.brand-text b{font-family:'Oswald',sans-serif; font-size:15px; letter-spacing:.03em;}
.brand-text span{font-size:11px; color:var(--text-muted);}
.topbar .month{margin-left:auto; font-size:12px; color:var(--text-muted); text-align:right;}

main{flex:1; padding:16px; padding-bottom:96px; max-width:640px; margin:0 auto; width:100%;}

.tabbar{
  position:sticky; bottom:0; z-index:20;
  display:grid; grid-template-columns:repeat(5,1fr);
  background:var(--surface); border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabbar button{
  background:none; border:none; padding:9px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--text-muted); font-size:10.5px; cursor:pointer;
}
.tabbar button svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8;}
.tabbar button.active{color:var(--accent-strong);}
.tabbar button.active svg{stroke:var(--accent-strong);}

.section-title{font-size:13px; color:var(--text-muted); margin:22px 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
.section-title:first-child{margin-top:0;}

.cards-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px;}
.card.wide{grid-column:1/-1;}
.card .label{font-size:11.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em;}
.card .value{font-family:'Oswald',sans-serif; font-size:24px; margin-top:4px;}
.card .value.pos{color:var(--success);}
.card .value.neg{color:var(--danger);}
.card .sub{font-size:11.5px; color:var(--text-muted); margin-top:2px;}

.pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px;}
.pill.ok{background:var(--success-bg); color:var(--success);}
.pill.warn{background:var(--warning-bg); color:var(--warning);}
.pill.bad{background:var(--danger-bg); color:var(--danger);}
.pill.muted{background:var(--surface-2); color:var(--text-muted);}

.list{display:flex; flex-direction:column; gap:8px;}
.row-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; display:flex; align-items:center; gap:12px;}
.row-card .main{flex:1; min-width:0;}
.row-card .title{font-weight:600; font-size:14.5px;}
.row-card .meta{font-size:12px; color:var(--text-muted); margin-top:2px;}
.row-card .amount{font-family:'Oswald',sans-serif; font-size:16px; white-space:nowrap;}
.row-card .amount.pos{color:var(--success);}
.row-card .amount.neg{color:var(--danger);}
.row-card button.del{background:none; border:none; color:var(--text-muted); cursor:pointer; padding:4px; flex:none;}
.row-card.tap{cursor:pointer;}
.row-card .meta2{font-size:12px; color:var(--text-muted); margin-top:2px;}

.stat-list{display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
.stat-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 13px; background:var(--surface-2); border-radius:10px;}
.stat-row .k{font-size:12.5px; color:var(--text-muted);}
.stat-row .v{font-family:'Oswald',sans-serif; font-size:16px;}
.stat-row .v.pos{color:var(--success);} .stat-row .v.neg{color:var(--danger);}
.stat-row.total{background:var(--accent-soft); border:1px solid var(--border);}

.row-card button.flag{background:none; border:none; color:var(--text-muted); cursor:pointer; padding:4px; flex:none;}
.row-card button.flag.on{color:var(--danger);}
.owner-only-note{font-size:11.5px; color:var(--text-muted); margin-top:-2px; margin-bottom:14px;}

.wa-btn{color:#25D366; padding:4px; flex:none; display:inline-flex; align-items:center; text-decoration:none;}
.wa-top{margin-left:8px; background:#25D366; color:#fff; border-radius:10px; padding:7px;}

.month-nav{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px;}
.month-nav button{background:var(--surface-2); border:none; color:var(--text); width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
.month-nav button:disabled{opacity:.35; cursor:default;}
.month-nav .label{font-family:'Oswald',sans-serif; font-size:14px; text-transform:capitalize; letter-spacing:.02em;}

.moto-balance-row{display:flex; align-items:center; gap:10px; padding:11px 13px; background:var(--surface); border:1px solid var(--border); border-radius:10px; cursor:pointer;}
.moto-balance-row .main{flex:1; min-width:0;}
.moto-balance-row .title{font-weight:600; font-size:13.5px;}
.moto-balance-row .meta{font-size:11.5px; color:var(--text-muted); margin-top:1px;}
.moto-balance-row .amount{font-family:'Oswald',sans-serif; font-size:15px; white-space:nowrap;}

.cal-head-row, .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-head-row{margin-bottom:4px;}
.cal-head-row div{font-size:10px; text-align:center; color:var(--text-muted); text-transform:uppercase;}
.cal-grid{margin-bottom:10px;}
.cal-day{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; font-size:12px; background:var(--surface-2); color:var(--text-muted);}
.cal-day.blank{background:transparent;}
.cal-day.paid{background:var(--success-bg); color:var(--success); font-weight:700;}
.cal-day.miss{background:var(--danger-bg); color:var(--danger); font-weight:700;}
.cal-day.clickable{cursor:pointer;}
.cal-day.clickable:active{transform:scale(0.92);}
.cal-day.today{box-shadow:0 0 0 2px var(--accent-strong) inset;}
.cal-legend{display:flex; flex-wrap:wrap; gap:12px; font-size:11.5px; color:var(--text-muted); margin-bottom:18px;}
.cal-legend span{display:inline-flex; align-items:center; gap:5px;}
.cal-dot{width:9px; height:9px; border-radius:3px; display:inline-block;}
.cal-dot.paid{background:var(--success);} .cal-dot.miss{background:var(--danger);} .cal-dot.blank{background:var(--surface-2); border:1px solid var(--border);}

.empty{padding:34px 18px; text-align:center; color:var(--text-muted); border:1px dashed var(--border); border-radius:var(--radius); font-size:13.5px;}
.empty b{display:block; color:var(--text); font-family:'Oswald',sans-serif; font-size:15px; text-transform:none; letter-spacing:0; margin-bottom:4px;}

.fab{
  position:fixed; right:18px; bottom:calc(78px + env(safe-area-inset-bottom,0px)); z-index:25;
  width:52px; height:52px; border-radius:16px; border:none; cursor:pointer;
  background:var(--accent-strong); color:var(--accent-contrast);
  display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(0,0,0,.25);
}
.fab svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:2;}

.sheet-backdrop{position:fixed; inset:0; background:rgba(10,8,2,.45); z-index:40; display:flex; align-items:flex-end;}
.sheet{
  background:var(--surface); width:100%; max-width:640px; margin:0 auto; border-radius:18px 18px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow-y:auto;
  border-top:1px solid var(--border);
}
.sheet h2{font-size:17px; margin-bottom:14px;}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.field label{font-size:12px; color:var(--text-muted);}
.field-error{font-size:12px; color:var(--danger); margin-top:2px;}
.photo-preview{margin-top:6px; display:flex; align-items:center; gap:10px;}
.photo-preview img{width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--border);}
.photo-badge{color:var(--text-muted); flex:none; display:flex; align-items:center;}
.field input, .field select, .field textarea{
  background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 11px; font-size:14.5px; color:var(--text); font-family:inherit;
}
.field textarea{resize:vertical; min-height:56px;}
.seg{display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden;}
.seg button{flex:1; padding:9px; background:var(--bg); border:none; color:var(--text-muted); font-weight:600; font-size:13px; cursor:pointer;}
.seg button.active{background:var(--accent-strong); color:var(--accent-contrast);}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.sheet-actions{display:flex; gap:10px; margin-top:6px;}
.btn{flex:1; padding:12px; border-radius:10px; border:none; font-weight:600; font-size:14px; cursor:pointer;}
.btn.primary{background:var(--accent-strong); color:var(--accent-contrast);}
.btn.ghost{background:var(--surface-2); color:var(--text);}

.banner{background:var(--accent-soft); border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px; font-size:13px; color:var(--text); margin-bottom:16px; line-height:1.5;}
.banner b{color:var(--accent-strong);}

.moto-select-strip{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:16px;}
.moto-select-strip button{
  flex:none; padding:7px 13px; border-radius:99px; border:1px solid var(--border); background:var(--surface);
  color:var(--text-muted); font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.moto-select-strip button.active{background:var(--accent-strong); color:var(--accent-contrast); border-color:var(--accent-strong);}

.gps-block{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px;}
.gps-block .h{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.gps-block .h .title{font-weight:600; font-size:14.5px;}
.gps-mini{display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:12.5px; color:var(--text-muted);}
.gps-mini b{color:var(--text); font-weight:600; display:block; font-size:13px;}

::placeholder{color:var(--text-muted); opacity:.7;}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(90px + env(safe-area-inset-bottom,0px)); z-index:60; max-width:min(92vw,520px); background:var(--text); color:var(--bg); padding:11px 15px; border-radius:11px; font-size:13px; line-height:1.45; box-shadow:0 8px 20px rgba(0,0,0,.25);}
.toast.err{background:var(--danger); color:#fff;}
.desglose{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-top:10px;}
.desglose summary{cursor:pointer; padding:12px 14px; font-weight:600; font-size:13.5px; list-style:none; display:flex; justify-content:space-between; gap:10px; align-items:center;}
.desglose summary::-webkit-details-marker{display:none;}
.desglose summary .chev{color:var(--text-muted); font-size:12px; font-weight:500;}
.desglose[open] summary{border-bottom:1px solid var(--border);}
.desglose .body{padding:10px 14px 14px;}
.dg-row{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px dashed var(--border); font-size:12.5px;}
.dg-row:last-child{border-bottom:none;}
.dg-row .main{flex:1; min-width:0;}
.dg-row .t{font-weight:600; font-size:13px;}
.dg-row .m{color:var(--text-muted); margin-top:1px;}
.dg-row .amt{font-family:'Oswald',sans-serif; font-size:14.5px; white-space:nowrap;}
.dg-row .amt.pos{color:var(--success);} .dg-row .amt.neg{color:var(--danger);}
.dg-src{display:inline-block; font-size:10.5px; font-weight:600; padding:1px 7px; border-radius:99px; background:var(--surface-2); color:var(--text-muted); margin-left:4px;}
.dg-total{display:flex; justify-content:space-between; padding-top:10px; margin-top:4px; border-top:1px solid var(--border); font-weight:600;}
.warn-box{background:var(--warning-bg); color:var(--warning); border-radius:10px; padding:10px 12px; font-size:12.5px; line-height:1.5; margin-bottom:10px;}
.warn-box b{display:block; margin-bottom:2px;}
.hint{font-size:12px; color:var(--warning); background:var(--warning-bg); border-radius:8px; padding:7px 9px; margin-top:4px;}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <form class="login-card" id="loginForm">
    <div class="mark">RZ</div>
    <h1>RZ Rentas Control</h1>
    <p>Ingresa el código de tu negocio y tu clave de acceso.</p>
    <div class="field"><label>Código del negocio</label><input id="loginNegocio" placeholder="p. ej. rzrentas" autocapitalize="off" autocomplete="off"></div>
    <div class="seg" id="loginRolSeg">
      <button type="button" class="active" data-v="dueno">Dueño</button>
      <button type="button" data-v="equipo">Encargado</button>
    </div>
    <div class="field"><label>Clave de acceso</label><input id="loginClave" type="password" autocomplete="off"></div>
    <div class="err" id="loginError"></div>
    <button type="submit" class="submit" id="loginSubmit">Entrar</button>
  </form>
</div>

<div id="app">
  <header class="topbar">
    <div class="mark">RZ</div>
    <div class="brand-text"><b>RZ RENTAS</b><span>Control del negocio</span></div>
    <div class="month" id="topMonth"></div>
    <button id="claveBtn" class="hdr-btn" aria-label="Cambiar clave del dueño" title="Cambiar clave" hidden><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2"/><path d="m16 7 3 3"/><path d="m18 5 2 2"/></svg></button>
    <button id="logoutBtn" aria-label="Cerrar sesión" title="Cerrar sesión"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    <a class="wa-btn wa-top" id="topWaBtn" href="#" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp" title="Escribir por WhatsApp">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.35 5.05L2 22l5.1-1.33A9.94 9.94 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2Zm5.2 14.3c-.22.62-1.28 1.19-1.77 1.24-.45.05-.94.24-3.17-.66-2.68-1.08-4.42-3.8-4.56-3.98-.13-.18-1.09-1.45-1.09-2.76 0-1.32.69-1.96.94-2.23.24-.26.53-.32.7-.32h.5c.17 0 .38-.03.6.45.22.5.73 1.72.8 1.84.06.13.1.28.02.45-.09.17-.13.28-.26.43-.13.15-.27.34-.39.46-.13.13-.26.27-.11.53.15.26.67 1.09 1.43 1.76.98.86 1.8 1.13 2.06 1.26.26.13.41.11.56-.07.15-.17.65-.75.82-1.01.17-.26.35-.22.58-.13.24.09 1.5.7 1.75.83.26.13.43.19.5.3.06.11.06.63-.16 1.24Z"/></svg>
    </a>
  </header>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="resumen" class="active">
      <svg viewBox="0 0 24 24"><path d="M4 13h6V4H4v9Zm10 7h6V4h-6v16ZM4 20h6v-4H4v4Z"/></svg>
      Resumen
    </button>
    <button data-tab="finanzas">
      <svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M14 7h6v6"/></svg>
      Finanzas
    </button>
    <button data-tab="motos">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17l3-8h5l3 5h3M9 9h4"/></svg>
      Motos
    </button>
    <button data-tab="mantenimiento">
      <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 1-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 1 5.4-5.4L21 6l-3-3-3.3 3.3Z"/></svg>
      Mant.
    </button>
    <button data-tab="gps">
      <svg viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>
      GPS
    </button>
  </nav>
</div>
<template id="tplSupervisionTab">
  <button data-tab="supervision">
    <svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.6 3.4 8.4 8 9 4.6-.6 8-4.4 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
    Supervisión
  </button>
</template>

<script>
(function(){
  "use strict";

  var db = null;
  var isOwnerView = false;
  // negocioId identifica a QUÉ NEGOCIO pertenecen los datos que se leen/escriben.
  // Se obtiene del correo con el que se inició sesión (ver checkNegocioLogin más
  // abajo): "rzrentas.dueno@rzcontrol.app" y "rzrentas.equipo@rzcontrol.app" son
  // las dos cuentas de UN mismo negocio llamado "rzrentas". Si vendes esta app a
  // otro dueño de motos, le creas sus propias cuentas con OTRO negocioId (p.ej.
  // "motosjp.dueno@..." / "motosjp.equipo@...") y sus datos quedan
  // completamente separados de los tuyos, aislados también por las reglas de
  // seguridad de Firestore (ver el archivo de reglas que te di aparte).
  var negocioId = null;
  function negocioPath(collectionName){
    return 'negocios/' + negocioId + '/' + collectionName;
  }
  // Avisos dentro de la página. (Los cuadros alert()/confirm() del navegador no
  // aparecen dentro de la vista de Claude: confirm() responde "no" solo, así que
  // el botón de reiniciar nómina nunca hacía nada allí.)
  var toastTimer = null;
  function showToast(msg, isError){
    var old = document.getElementById('rzToast'); if(old) old.remove();
    var t = document.createElement('div');
    t.id = 'rzToast'; t.className = 'toast' + (isError ? ' err' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.remove(); }, isError ? 7000 : 3500);
  }
  function showSaveError(err){
    var msg = (err && err.message) ? err.message : String(err);
    showToast('No se pudo guardar: ' + msg, true);
    console.error('Firestore write error:', err);
  }
  // Confirmación dentro de la página (reemplaza confirm()).
  function askConfirm(title, messageHtml, yesLabel, onYes, onNo){
    openSheet(
      '<h2>'+escapeHtml(title)+'</h2>'
      + '<div style="font-size:13.5px; line-height:1.55; margin-bottom:14px;">'+messageHtml+'</div>'
      + '<div class="sheet-actions"><button class="btn ghost" id="cfNo">Cancelar</button><button class="btn primary" id="cfYes">'+escapeHtml(yesLabel||'Sí, continuar')+'</button></div>',
      function(sheet){
        sheet.querySelector('#cfNo').addEventListener('click', function(){ closeSheet(); if(onNo) onNo(); });
        sheet.querySelector('#cfYes').addEventListener('click', function(){ closeSheet(); onYes(); });
      }
    );
  }
  // De cada pago de renta diaria, este monto fijo se separa automáticamente
  // para nómina/administración y NO se cuenta en la suma general de ingresos.
  // Si este valor cambia, solo hay que editar el número de aquí.
  var ADMIN_DIARIO = 5000;
  // Depósito reembolsable: de cada pago diario se aparta este monto para
  // devolvérselo al arrendatario al terminar la renta. No es ingreso del negocio
  // mientras esté en custodia; solo lo que se retenga al liquidar entra como ingreso.
  var DEPOSITO_DIARIO = 5000;
  var state = { motos: [], movimientos: [], mantenimientos: [], alertas: [], supervision: [], tab: 'resumen', motoFilter: 'todas', viewMonth: null, nominaConfig: { ultimoReinicio: 0 }, recurrentes: [] };
  var unsubs = [];

  // Registra el pago de un día de renta dividiéndolo automáticamente:
  // (tarifa - ADMIN_DIARIO) va como ingreso normal "Renta" (suma general),
  // y ADMIN_DIARIO va como tipo "nomina" (no se cuenta en la suma general,
  // se acumula aparte para pagos de nómina/administración).
  function registrarPagoRenta(moto, fecha, notaExtra, onDone, yaConfirmado){
    var total = Number(moto.tarifaDiaria) || 0;
    if(total<=0){
      showToast('La moto '+moto.placa+' no tiene tarifa diaria. Edítala y escribe la tarifa antes de registrar la renta.', true);
      return;
    }
    // Evita registrar dos veces la renta del mismo día (doble toque o dos personas).
    var yaExiste = state.movimientos.some(function(mv){
      return mv.motoId===moto.id && mv.tipo==='ingreso' && mv.categoria==='Renta' && mv.fecha===fecha;
    });
    if(yaExiste && !yaConfirmado){
      askConfirm('Renta ya registrada',
        'La moto <b>'+escapeHtml(moto.placa)+'</b> ya tiene una renta registrada el '+fmtDate(fecha)+'. ¿Registrar otra para el mismo día?',
        'Registrar otra', function(){ registrarPagoRenta(moto, fecha, notaExtra, onDone, true); });
      return;
    }
    // Las motos de otros propietarios no aportan a la nómina de RZ.
    var admin = cuentaDeMoto(moto) ? 0 : Math.min(ADMIN_DIARIO, total);
    var deposito = Math.min(DEPOSITO_DIARIO, total - admin);
    var general = total - admin - deposito;
    var base = { motoId: moto.id, motoPlaca: moto.placa, fecha: fecha, createdAt: Date.now(), cuenta: cuentaDeMoto(moto) };
    var batch = db.batch();
    var refGeneral = db.collection(negocioPath('movimientos')).doc();
    batch.set(refGeneral, Object.assign({}, base, { tipo: 'ingreso', monto: general, categoria: 'Renta', nota: notaExtra || '' }));
    if(admin > 0){
      var refAdmin = db.collection(negocioPath('movimientos')).doc();
      batch.set(refAdmin, Object.assign({}, base, { tipo: 'nomina', monto: admin, categoria: 'Administración', nota: 'Separado automático de la renta diaria' }));
    }
    if(deposito > 0){
      var refDep = db.collection(negocioPath('movimientos')).doc();
      batch.set(refDep, Object.assign({}, base, { tipo: 'deposito', monto: deposito, categoria: 'Depósito reembolsable', nota: 'Separado automático de la renta diaria' }));
    }
    batch.commit().then(onDone).catch(showSaveError);
  }
  // ---------- CUENTAS SEPARADAS (motos de otros propietarios) ----------
  // Cada moto tiene un "propietario". Vacío = RZ Rentas. Cualquier otro nombre
  // (p. ej. "Administrador") es una cuenta aparte: su plata y sus gastos NO
  // entran en los totales de RZ; se ven en su propia cuenta en Finanzas.
  function cuentaDeMoto(m){ return (m && m.propietario) ? String(m.propietario) : ''; }
  function cuentaDeMotoId(id){ return id ? cuentaDeMoto(motoById(id)) : ''; }
  // Si la moto existe, manda su propietario. Si la moto se eliminó, se usa la
  // cuenta que quedó grabada en el registro, para que su historia no cambie de cuenta.
  function cuentaDeMov(mv){
    if(mv.motoId){ var m = motoById(mv.motoId); return m ? cuentaDeMoto(m) : (mv.cuenta || ''); }
    return mv.cuenta || '';
  }
  function cuentaDeMant(mt){ var m = motoById(mt.motoId); return m ? cuentaDeMoto(m) : (mt.cuenta || ''); }
  function nombreCuenta(c){ return c ? c : 'RZ Rentas'; }
  function motoTieneRegistros(id){
    return state.movimientos.some(function(mv){ return mv.motoId===id; }) || state.mantenimientos.some(function(mt){ return mt.motoId===id; });
  }
  // Opciones de moto agrupadas por cuenta. Con "soloCuenta" (texto) solo salen
  // las motos de esa cuenta, para que sea imposible elegir una de la otra.
  function motoOptionsHtml(selectedId, soloCuenta){
    var cuentas = [''].concat(cuentasTerceros());
    if(typeof soloCuenta==='string') cuentas = [soloCuenta];
    var hayTerceros = cuentasTerceros().length>0;
    return cuentas.map(function(c){
      var grupo = state.motos.filter(function(m){ return cuentaDeMoto(m)===c; });
      if(!grupo.length) return '';
      var opts = grupo.map(function(m){ return '<option value="'+m.id+'"'+(selectedId===m.id?' selected':'')+'>'+escapeHtml(motoLabel(m))+'</option>'; }).join('');
      return hayTerceros ? '<optgroup label="'+escapeHtml(c?('Motos de '+c+' (cuenta aparte)'):'Motos de RZ Rentas')+'">'+opts+'</optgroup>' : opts;
    }).join('');
  }
  function cuentaBanner(c){
    if(!cuentasTerceros().length) return '';
    return '<div class="banner" style="margin-bottom:12px;">Se registra en la cuenta de <b>'+escapeHtml(nombreCuenta(c))+'</b>.</div>';
  }

  function cuentasTerceros(){
    var set = {};
    state.motos.forEach(function(m){ var c = cuentaDeMoto(m); if(c) set[c] = true; });
    state.movimientos.forEach(function(mv){ if(!mv.motoId && mv.cuenta) set[mv.cuenta] = true; });
    return Object.keys(set).sort();
  }

  // ---------- DEPÓSITO REEMBOLSABLE POR MOTO ----------
  // Se suma lo apartado en cada día pagado desde la última liquidación de esa
  // moto (moto.depositoCorte). Al pasar la moto a "Disponible" se liquida:
  // se devuelve lo que corresponda y el acumulado vuelve a $0.
  function depositoMoto(motoId){
    var m = motoById(motoId) || {};
    var corte = Number(m.depositoCorte||0);
    var docs = state.movimientos.filter(function(mv){ return mv.motoId===motoId && mv.tipo==='deposito' && Number(mv.createdAt||0) > corte; });
    var total = docs.reduce(function(a,mv){ return a+Number(mv.monto||0); },0);
    var dias = {};
    docs.forEach(function(mv){ if(mv.categoria==='Depósito reembolsable') dias[mv.fecha]=true; });
    return { total:total, dias:Object.keys(dias).length, docs:docs };
  }
  function depositosEnCustodia(cuenta){
    cuenta = cuenta || '';
    return state.motos.filter(function(m){ return cuentaDeMoto(m)===cuenta; })
      .reduce(function(a,m){ return a + depositoMoto(m.id).total; },0);
  }
  // Días pagados de la renta actual que se registraron antes de existir el
  // depósito (no tienen su parte apartada). Se pueden pasar al depósito a mano.
  function diasSinDeposito(m){
    if(m.estado!=='rentada' || !m.fechaInicioRenta) return [];
    var corte = Number(m.depositoCorte||0);
    return state.movimientos.filter(function(mv){
      if(mv.motoId!==m.id || mv.tipo!=='ingreso' || mv.categoria!=='Renta') return false;
      if(mv.fecha < m.fechaInicioRenta || Number(mv.createdAt||0) <= corte) return false;
      return !state.movimientos.some(function(d){ return d.tipo==='deposito' && d.motoId===m.id && d.createdAt===mv.createdAt; });
    });
  }
  function liquidacionesMoto(motoId){
    return state.movimientos.filter(function(mv){ return mv.motoId===motoId && mv.tipo==='deposito_liq'; })
      .sort(function(a,b){ return Number(b.createdAt||0)-Number(a.createdAt||0); });
  }

  // Total de nómina/administración acumulado desde el último reinicio (último pago de nómina hecho).
  function nominaAcumulada(){
    var desde = (state.nominaConfig && state.nominaConfig.ultimoReinicio) || 0;
    return state.movimientos.filter(function(m){ return m.tipo==='nomina' && Number(m.createdAt||0) > desde; })
      .reduce(function(a,m){ return a + Number(m.monto||0); }, 0);
  }
  // ---------- GASTOS FIJOS MENSUALES (seguro todo riesgo, etc.) ----------
  // La lista se guarda en config/recurrentes (un solo documento), y cada vez que
  // se paga un mes se crea un gasto normal en Finanzas marcado con
  // recurrenteId + recurrenteMes. Así se sabe qué está pagado en cada mes y el
  // gasto entra al saldo como cualquier otro.
  function subscribeRecurrentes(){
    var un = db.doc(negocioPath('config')+'/recurrentes').onSnapshot(function(doc){
      state.recurrentes = (doc.exists && Array.isArray(doc.data().items)) ? doc.data().items : [];
      render();
    }, function(err){ console.error('config/recurrentes', err); });
    unsubs.push(un);
  }
  function saveRecurrentes(items, onDone){
    db.doc(negocioPath('config')+'/recurrentes').set({ items: items, updatedAt: Date.now() })
      .then(function(){ if(onDone) onDone(); }).catch(showSaveError);
  }
  function pagoRecurrente(rec, mk){
    return state.movimientos.find(function(mv){ return mv.recurrenteId===rec.id && mv.recurrenteMes===mk; });
  }
  function fechaRecurrente(rec, mk){
    var y = Number(mk.slice(0,4)), mo = Number(mk.slice(5,7));
    var dia = Math.min(Number(rec.dia)||1, new Date(y, mo, 0).getDate());
    var venc = mk+'-'+(dia<10?'0'+dia:dia);
    var hoy = todayISO();
    // En el mes actual se registra con la fecha de hoy si aún no llega el día de pago.
    return { vence: venc, registrar: (mk===monthKey(hoy) && venc>hoy) ? hoy : venc };
  }
  function recurrentesDelMes(mk, cuenta){
    var hoy = todayISO();
    cuenta = cuenta || '';
    return state.recurrentes.filter(function(r){ return r.activo!==false && (!r.desde || r.desde<=mk) && (!r.motoId || motoById(r.motoId)) && cuentaDeMotoId(r.motoId)===cuenta; }).map(function(r){
      var f = fechaRecurrente(r, mk);
      var pago = pagoRecurrente(r, mk);
      var moto = r.motoId ? motoById(r.motoId) : null;
      return { rec:r, pago:pago, vence:f.vence, fechaReg:f.registrar, moto:moto, vencido: !pago && f.vence<hoy };
    }).sort(function(a,b){ return a.vence.localeCompare(b.vence) || ((a.moto&&a.moto.placa)||'').localeCompare((b.moto&&b.moto.placa)||''); });
  }
  function registrarRecurrente(rec, mk, monto, onDone){
    if(pagoRecurrente(rec, mk)){ showToast('Ese gasto ya está registrado en este mes.'); return; }
    var moto = rec.motoId ? motoById(rec.motoId) : null;
    var nombreMes = new Date(mk+'-02').toLocaleDateString('es-CO',{month:'long',year:'numeric'});
    db.collection(negocioPath('movimientos')).add({
      tipo:'gasto', monto: monto, categoria: rec.categoria||'Seguros (SOAT/todo riesgo)',
      motoId: rec.motoId||null, motoPlaca: moto?moto.placa:null,
      fecha: fechaRecurrente(rec, mk).registrar,
      nota: rec.nombre+' — '+nombreMes, fotoUrl:null,
      recurrenteId: rec.id, recurrenteMes: mk, createdAt: Date.now(), cuenta: cuentaDeMotoId(rec.motoId)
    }).then(function(){ if(onDone) onDone(); }).catch(showSaveError);
  }

  function renderRecurrentes(mk, cuenta){
    var lista = recurrentesDelMes(mk, cuenta);
    var nombreMes = new Date(mk+'-02').toLocaleDateString('es-CO',{month:'long'});
    var html = '<div class="section-title"><span>Gastos fijos de '+nombreMes+'</span>'
      + (isOwnerView ? '<button class="pill muted" id="recAdmin" style="cursor:pointer;border:none;">'+(state.recurrentes.length?'Administrar':'+ Agregar')+'</button>' : '')
      + '</div>';
    if(lista.length===0){
      html += '<div class="empty" style="margin-bottom:6px;"><b>Sin gastos fijos</b>'+(isOwnerView
        ? 'Agrega el seguro todo riesgo de cada moto una vez, y cada mes lo registras con un toque.'
        : 'El dueño todavía no ha configurado gastos fijos.')+'</div>';
      return html;
    }
    var pendientes = lista.filter(function(x){return !x.pago;});
    var totalPend = pendientes.reduce(function(a,x){return a+Number(x.rec.monto||0);},0);
    var totalPag = lista.filter(function(x){return x.pago;}).reduce(function(a,x){return a+Number(x.pago.monto||0);},0);
    html += '<div class="list">' + lista.map(function(x){
      var pill = x.pago ? '<span class="pill ok">Pagado</span>'
        : (x.vencido ? '<span class="pill bad">Vencido</span>' : '<span class="pill warn">Vence '+Number(x.vence.slice(8))+' '+nombreMes.slice(0,3)+'</span>');
      return '<div class="row-card"><div class="main">'
        + '<div class="title">'+escapeHtml(x.moto?x.moto.placa:(x.rec.motoId?'Moto eliminada':'General'))+' · '+escapeHtml(x.rec.nombre)+'</div>'
        + '<div class="meta">'+(x.pago?('Pagado '+fmtDate(x.pago.fecha)):('Se paga el día '+Number(x.rec.dia||1)))+'</div>'
        + '<div style="display:flex; align-items:center; gap:8px; margin-top:6px; flex-wrap:wrap;"><span class="amount neg">'+fmtMoney(x.pago?x.pago.monto:x.rec.monto)+'</span>'+pill+'</div></div>'
        + (x.pago ? '' : '<button class="btn primary" data-rec-pagar="'+x.rec.id+'" style="flex:none; padding:7px 12px; font-size:12.5px;">Registrar</button>')
        + '</div>';
    }).join('') + '</div>';
    html += '<div class="stat-list" style="margin-top:10px;">'
      + statRow('Pagado este mes', fmtMoney(totalPag), 'neg')
      + (pendientes.length ? statRow('Pendiente ('+pendientes.length+')', fmtMoney(totalPend), '') : '')
      + '</div>';
    if(pendientes.length>1){
      html += '<div class="sheet-actions" style="margin-top:-6px; margin-bottom:6px;"><button class="btn ghost" id="recPagarTodos">Registrar los '+pendientes.length+' pendientes ('+fmtMoney(totalPend)+')</button></div>';
    }
    return html;
  }

  function openPagarRecurrente(rec, mk){
    var moto = rec.motoId ? motoById(rec.motoId) : null;
    var f = fechaRecurrente(rec, mk);
    openSheet(
      '<h2>Registrar '+escapeHtml(rec.nombre)+'</h2>'
      + '<div class="owner-only-note">'+escapeHtml(moto?moto.placa:'General')+' · '+new Date(mk+'-02').toLocaleDateString('es-CO',{month:'long',year:'numeric'})+' · se guarda con fecha '+fmtDate(f.registrar)+'</div>'
      + '<div class="field"><label for="rpMonto">Monto pagado (COP)</label><input id="rpMonto" type="text" inputmode="numeric" value="'+(Number(rec.monto)||'')+'"><div class="field-error" id="rpErr" hidden>Ingresa un monto mayor a cero.</div></div>'
      + '<div class="sheet-actions"><button class="btn ghost" id="cancelSheet">Cancelar</button><button class="btn primary" id="rpSave">Registrar gasto</button></div>',
      function(sheet){
        sheet.querySelector('#cancelSheet').addEventListener('click', closeSheet);
        sheet.querySelector('#rpSave').addEventListener('click', function(){
          var monto = parseMoney(sheet.querySelector('#rpMonto').value);
          if(!monto){ sheet.querySelector('#rpErr').hidden = false; return; }
          registrarRecurrente(rec, mk, monto, function(){ closeSheet(); showToast(rec.nombre+' registrado.'); });
        });
      }
    );
  }

  function openAdminRecurrentes(){
    if(!isOwnerView) return;
    var cuentaAdm = state.cuenta || '';
    var items = state.recurrentes.filter(function(r){ return cuentaDeMotoId(r.motoId)===cuentaAdm; });
    var html = '<h2>Gastos fijos mensuales</h2>' + cuentaBanner(cuentaAdm);
    if(items.length){
      html += '<div class="list" style="margin-bottom:14px;">' + items.map(function(r){
        var moto = r.motoId ? motoById(r.motoId) : null;
        return '<div class="row-card"><div class="main">'
          + '<div class="title">'+escapeHtml(moto?moto.placa:(r.motoId?'Moto eliminada':'General'))+' · '+escapeHtml(r.nombre)+'</div>'
          + '<div class="meta">'+fmtMoney(r.monto)+' · día '+Number(r.dia||1)+' de cada mes'+(r.activo===false?' · pausado':'')+'</div></div>'
          + '<button class="pill muted" data-rec-edit="'+r.id+'" style="cursor:pointer;border:none;">Editar</button>'
          + '</div>';
      }).join('') + '</div>';
    }
    html += '<div class="sheet-actions"><button class="btn ghost" id="cancelSheet">Cerrar</button><button class="btn primary" id="recNuevo">+ Nuevo gasto fijo</button></div>';
    openSheet(html, function(sheet){
      sheet.querySelector('#cancelSheet').addEventListener('click', closeSheet);
      sheet.querySelector('#recNuevo').addEventListener('click', function(){ openRecForm(null); });
      sheet.querySelectorAll('[data-rec-edit]').forEach(function(b){
        b.addEventListener('click', function(){
          var r = state.recurrentes.find(function(x){return x.id===b.getAttribute('data-rec-edit');});
          if(r) openRecForm(r);
        });
      });
    });
  }

  function openRecForm(existing){
    var r = existing || { nombre:'Seguro todo riesgo', categoria:'Seguros (SOAT/todo riesgo)', dia:1 };
    var cuentaAct = existing ? cuentaDeMotoId(existing.motoId) : (state.cuenta || '');
    var motoOpts = (existing ? '' : '<option value="__todas">Todas las motos de '+escapeHtml(nombreCuenta(cuentaAct))+' (uno por cada moto)</option>')
      + motoOptionsHtml(r.motoId, cuentaAct)
      // Un gasto fijo sin moto solo puede ser de RZ.
      + (cuentaAct ? '' : '<option value=""'+(existing&&!existing.motoId?' selected':'')+'>Sin moto (gasto general de RZ Rentas)</option>');
    var cats = ['Seguros (SOAT/todo riesgo)','Mantenimiento','Administrativo','Otro gasto'];
    openSheet(
      '<h2>'+(existing?'Editar gasto fijo':'Nuevo gasto fijo')+'</h2>'
      + cuentaBanner(cuentaAct)
      + '<div class="field"><label for="rcNombre">Nombre</label><input id="rcNombre" value="'+escapeHtml(r.nombre||'')+'" placeholder="Seguro todo riesgo"></div>'
      + '<div class="field"><label for="rcMoto">Moto</label><select id="rcMoto">'+motoOpts+'</select></div>'
      + '<div class="two-col"><div class="field"><label for="rcMonto">Valor mensual (COP)</label><input id="rcMonto" type="text" inputmode="numeric" value="'+(r.monto||'')+'" placeholder="120000"></div>'
      + '<div class="field"><label for="rcDia">Día de pago</label><input id="rcDia" type="number" min="1" max="31" value="'+(r.dia||1)+'"></div></div>'
      + '<div class="field"><label for="rcCat">Categoría</label><select id="rcCat">'+cats.map(function(c){return '<option'+(r.categoria===c?' selected':'')+'>'+c+'</option>';}).join('')+'</select></div>'

  function fmtMoney(n){
    n = Number(n)||0;
    return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
  }
  // Convierte cualquier forma en que alguien escriba una plata en pesos colombianos
  // ("50.000", "1.500.000", "50,000", "$ 50000", con espacios, etc.) a un número
  // entero limpio, quitando todo lo que no sea dígito. Así no importa si la
  // persona usa el punto como separador de miles (como es normal en Colombia).
  function parseMoney(v){
    var s = String(v==null?'':v).trim();
    // Si termina en un separador seguido de 1 o 2 dígitos ("75.000,50", "75000.00"),
    // eso son centavos: se descartan. Antes se pegaban al número y "75000.00"
    // quedaba como 7.500.000. Con 3 dígitos ("1.500") sí es separador de miles.
    s = s.replace(/[.,]\d{1,2}$/, '');
    var digits = s.replace(/[^0-9]/g,'');
    return digits ? Number(digits) : 0;
  }

  // Comprime una foto (recibo/factura) a un data URL JPEG que quepa dentro del
  // límite de tamaño de un registro de la base de datos (256 KB en total, así
  // que dejamos margen: apuntamos a ~150 KB para el texto codificado de la
  // imagen). Va reduciendo tamaño y calidad hasta que entra, o hasta rendirse
  // después de varios intentos. No necesita el permiso especial de "editor" de
  // Claude porque viaja igual que cualquier otro dato que ya guarda la app.
  function compressImageToDataURL(file, maxBytes, done){
    maxBytes = maxBytes || 150000;
    var reader = new FileReader();
    reader.onerror = function(){ done(null, 'No se pudo leer la imagen.'); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ done(null, 'El archivo no parece ser una imagen válida.'); };
      img.onload = function(){
        var sizes = [1400, 1100, 850, 650, 500, 380];
        var qualities = [0.75, 0.6, 0.45, 0.3];
        var best = null;
        for(var s=0; s<sizes.length && !best; s++){
          var maxDim = sizes[s];
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); // fondo blanco por si la foto tiene transparencia
          ctx.drawImage(img, 0, 0, w, h);
          for(var q=0; q<qualities.length; q++){
            var url = canvas.toDataURL('image/jpeg', qualities[q]);
            if(url.length <= maxBytes){ best = url; break; }
          }
        }
        if(best) done(best, null);
        else done(null, 'La foto es muy pesada incluso reducida. Prueba con otra imagen.');
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  function fmtDate(iso){
    if(!iso) return '—';
    var d = new Date(iso+'T00:00:00');
    if(isNaN(d)) return iso;
    return d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
  }
  // Siempre calcula "hoy" en hora de Colombia (America/Bogota, UTC-5, sin horario
  // de verano) sin importar la zona horaria configurada en el dispositivo de quien
  // esté usando la app — así el dueño y todos los encargados ven la misma fecha.
  function todayISO(){
    try {
      return new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/Bogota', year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(new Date());
    } catch(e){
      // Respaldo si el navegador no soporta zonas horarias con Intl: se calcula
      // manualmente restando el desfase fijo de Bogotá desde UTC.
      var utcMs = Date.now();
      var bogota = new Date(utcMs - 5*60*60*1000);
      var y = bogota.getUTCFullYear(), m = bogota.getUTCMonth()+1, day = bogota.getUTCDate();
      return y+'-'+(m<10?'0'+m:m)+'-'+(day<10?'0'+day:day);
    }
  }
  function monthKey(iso){ return (iso||'').slice(0,7); }
  function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function daysUntil(iso){
    if(!iso) return null;
    // Se compara contra "hoy" en hora de Colombia, igual que el resto de la app.
    var d = new Date(iso+'T00:00:00Z'), now = new Date(todayISO()+'T00:00:00Z');
    if(isNaN(d)) return null;
    return Math.round((d-now)/86400000);
  }

  var currentMonth = todayISO().slice(0,7); // mes real de hoy — usado para vencimientos, calendario y "días sin pago"
  state.viewMonth = currentMonth; // mes que se está consultando en Resumen/Finanzas — navegable
  document.getElementById('topMonth').textContent = new Date(currentMonth+'-02').toLocaleDateString('es-CO',{month:'long',year:'numeric'});
  // Si la app queda abierta de un mes al otro (p. ej. del 31 al 1), el mes actual
  // se quedaba congelado en el mes viejo. Ahora se revisa en cada pantalla.
  function refreshToday(){
    var nowMonth = todayISO().slice(0,7);
    if(nowMonth!==currentMonth){
      if(state.viewMonth===currentMonth) state.viewMonth = nowMonth;
      currentMonth = nowMonth;
      document.getElementById('topMonth').textContent = new Date(currentMonth+'-02').toLocaleDateString('es-CO',{month:'long',year:'numeric'});
    }
  }

  function shiftMonth(monthStr, delta){
    var y = Number(monthStr.slice(0,4)), m = Number(monthStr.slice(5,7));
    var d = new Date(y, m-1+delta, 1);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  }

      + '<div class="label">'+label+'</div>'

      + '</div>';
  }
  // Ingresos/gastos de UNA moto limitados a un mes específico (para el
  // desglose "balance por moto" del mes que se está consultando). El balance
  // de por vida sigue estando en el detalle de cada moto (computeMotoStats).
  function computeMotoStatsForMonth(motoId, monthKeyStr){
    var movs = state.movimientos.filter(function(m){return m.motoId===motoId && monthKey(m.fecha)===monthKeyStr;});
    var ingresos = movs.filter(function(m){return m.tipo==='ingreso';}).reduce(function(a,m){return a+Number(m.monto||0);},0);
    var gastosMov = movs.filter(function(m){return m.tipo==='gasto';}).reduce(function(a,m){return a+Number(m.monto||0);},0);
    var mant = state.mantenimientos.filter(function(mt){return mt.motoId===motoId && monthKey(mt.fecha)===monthKeyStr;}).reduce(function(a,mt){return a+Number(mt.costo||0);},0);
    var gastos = gastosMov + mant;
    return { ingresos:ingresos, gastos:gastos, balance:ingresos-gastos };
  }

  function motoLabel(m){ return (m.placa||'Sin placa') + (m.marca?(' · '+m.marca+(m.modelo?' '+m.modelo:'')):''); }
  function motoById(id){ return state.motos.find(function(m){return m.id===id;}); }

  // Contabilidad por moto: ingresos por renta, gastos asociados, balance neto,
  // y recuperación frente al valor de compra de esa moto en particular.
  function computeMotoStats(motoId){
    var movs = state.movimientos.filter(function(m){return m.motoId===motoId;});
    var ingresos = movs.filter(function(m){return m.tipo==='ingreso';}).reduce(function(a,m){return a+Number(m.monto||0);},0);
    var gastosMov = movs.filter(function(m){return m.tipo==='gasto';}).reduce(function(a,m){return a+Number(m.monto||0);},0);
    var mant = state.mantenimientos.filter(function(mt){return mt.motoId===motoId;}).reduce(function(a,mt){return a+Number(mt.costo||0);},0);
    var gastos = gastosMov + mant;
    var balance = ingresos - gastos;
    var compra = Number((motoById(motoId)||{}).valorCompra||0);
    var recuperado = compra>0 ? Math.max(0, Math.min(100, Math.round((balance/compra)*100))) : null;
    return { movs:movs, ingresos:ingresos, gastos:gastos, mant:mant, balance:balance, compra:compra, recuperado:recuperado };
  }
  // Número de WhatsApp Business de RZ Rentas: los botones de WhatsApp abren un
  // chat hacia este número con el mensaje de la alerta ya redactado (el

  var WHATSAPP_NUMBER = '573124726450';
  function waHref(msg){ return 'https://wa.me/'+WHATSAPP_NUMBER + (msg ? ('?text='+encodeURIComponent(msg)) : ''); }
  // Normaliza un número de celular colombiano a formato internacional (57 + 10 dígitos)
  // para armar un link de WhatsApp directo, sin importar cómo lo hayan escrito
  // (con espacios, guiones, +57 al inicio, etc.).
  function normalizePhoneCO(v){
    var digits = String(v||'').replace(/[^0-9]/g,'');
    if(!digits) return '';
    if(digits.length===10) return '57'+digits; // celular local de 10 dígitos
    if(digits.length===12 && digits.slice(0,2)==='57') return digits; // ya viene con 57
    if(digits.length===13 && digits.slice(0,3)==='057') return digits.slice(1);
    return digits; // se deja tal cual si no calza con los formatos usuales
  }
  function waHrefTo(phone, msg){
    var n = normalizePhoneCO(phone);
    if(!n) return '';
    return 'https://wa.me/'+n + (msg ? ('?text='+encodeURIComponent(msg)) : '');
  }

      + '</a>';
  }

  var GASTO_ALTO_SIN_NOTA = 300000;

  // Alertas automáticas: se calculan de los datos compartidos (motos/movimientos),
  // así que su existencia no es secreta — solo se OCULTA la pestaña a quien no sea
  // el dueño de la app. La privacidad real (notas de "sospechoso") va en la
  // colección "supervision", protegida por reglas de la base de datos.
  function computeAutoAlerts(){
    var out = [];
    state.motos.forEach(function(m){
      var missed = computeMissedDays(m.id, currentMonth);
      if(missed.length>0){
        var mensaje = missed.length===1
          ? 'Marcada como rentada, sin renta registrada el '+fmtDate(missed[0])
          : missed.length+' días sin renta registrada este mes (desde '+fmtDate(missed[0])+')';
        out.push({tipo:'sin_pago', motoPlaca:m.placa, mensaje:mensaje, diasSinPago:missed.length});
      }
    });
    state.movimientos.forEach(function(mv){
      if(mv.tipo==='gasto' && Number(mv.monto||0)>=GASTO_ALTO_SIN_NOTA && !(mv.nota&&mv.nota.trim())){
        out.push({tipo:'gasto_sin_nota', motoPlaca:mv.motoPlaca||'General', mensaje:'Gasto de '+fmtMoney(mv.monto)+' ('+(mv.categoria||'')+') sin nota que lo justifique', movId:mv.id, fecha:mv.fecha});
      }
    });
    return out;
  }
  function supervisionDoc(movId){ return state.supervision.find(function(s){return s.id===movId;}); }

  // Días del mes en que la moto estuvo "rentada" y no se registró pago de renta.
  // El día de HOY nunca se cuenta como "en mora" (todavía puede pagarse antes de
  // que termine) — solo días anteriores ya cerrados y sin pago registrado.
  // Si no se definió fecha de inicio de renta, no hay nada que evaluar aún.
  function computeMissedDays(motoId, monthKeyStr){
    var m = motoById(motoId);
    if(!m || m.estado!=='rentada') return [];
    var today = todayISO();
    var paidDates = {};
    state.movimientos.forEach(function(mv){
      if(mv.motoId===motoId && mv.tipo==='ingreso' && mv.categoria==='Renta') paidDates[mv.fecha]=true;
    });
    if(!m.fechaInicioRenta){
      return [];
    }
    var year = Number(monthKeyStr.slice(0,4)), month = Number(monthKeyStr.slice(5,7));
    var daysInMonth = new Date(year, month, 0).getDate();
    var missed = [];
    for(var d=1; d<=daysInMonth; d++){
      var iso = monthKeyStr+'-'+(d<10?'0'+d:d);
      if(iso>=today) break;
      if(iso<m.fechaInicioRenta) continue;
      if(!paidDates[iso]) missed.push(iso);
    }
    return missed;
  }

  // Calendario de pagos de una moto para CUALQUIER mes. Los pagos nunca se
  // borran al cambiar de mes: cada renta queda guardada con su fecha, y aquí
  // se puede navegar hacia atrás para verificar día por día.
  var calMonth = null;
  function rentaDelDia(motoId, iso){
    // Junta la parte "Renta" y su parte de nómina para mostrar lo cobrado completo.
    var rentas = state.movimientos.filter(function(mv){ return mv.motoId===motoId && mv.tipo==='ingreso' && mv.categoria==='Renta' && mv.fecha===iso; });
    return rentas.map(function(r){
      var extra = state.movimientos.filter(function(mv){ return (mv.tipo==='nomina' || (mv.tipo==='deposito' && mv.categoria==='Depósito reembolsable')) && mv.motoId===motoId && mv.fecha===iso && mv.createdAt===r.createdAt; })
        .reduce(function(a,mv){ return a+Number(mv.monto||0); },0);
      return { renta:r, cobrado:Number(r.monto||0)+extra };
    });
  }
  function renderMotoCalendar(motoId){
    var m = motoById(motoId);
    var mk = calMonth || currentMonth;
    var labelMes = new Date(mk+'-02').toLocaleDateString('es-CO',{month:'long',year:'numeric'});
    var html = '<div class="section-title" style="margin-top:20px;">Calendario de pagos</div>';
    html += '<div class="month-nav">'
      + '<button data-cal-month="-1" aria-label="Mes anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>'
      + '<div class="label">'+labelMes+'</div>'
      + '<button data-cal-month="1" aria-label="Mes siguiente"'+(mk>=currentMonth?' disabled':'')+'><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>'
      + '</div>';

    var evaluaMora = m.estado==='rentada' && !!m.fechaInicioRenta;
    var missedSet = {};
    if(evaluaMora) computeMissedDays(motoId, mk).forEach(function(iso){ missedSet[iso]=true; });
    var paidSet = {};
    state.movimientos.forEach(function(mv){
      if(mv.motoId===motoId && mv.tipo==='ingreso' && mv.categoria==='Renta' && monthKey(mv.fecha)===mk) paidSet[mv.fecha]=true;
    });
    var year = Number(mk.slice(0,4)), month = Number(mk.slice(5,7));
    var daysInMonth = new Date(year, month, 0).getDate();
    var firstDow = (new Date(year, month-1, 1).getDay()+6)%7; // 0=lunes
    var today = todayISO();

    html += '<div class="cal-head-row">' + ['L','M','M','J','V','S','D'].map(function(d){return '<div>'+d+'</div>';}).join('') + '</div>';
    html += '<div class="cal-grid">';
    for(var i=0;i<firstDow;i++) html += '<div class="cal-day blank"></div>';
    for(var d=1; d<=daysInMonth; d++){
      var iso = mk+'-'+(d<10?'0'+d:d);
      var cls = 'cal-day';
      var clickAttr = '';
      if(iso>today) cls += ' blank';
      else if(paidSet[iso]){ cls += ' paid clickable'; clickAttr = ' data-cal-info="'+iso+'"'; }
      else if(missedSet[iso]){ cls += ' miss clickable'; clickAttr = ' data-cal-pay="'+iso+'"'; }
      if(iso===today) cls += ' today';
      html += '<div class="'+cls+'"'+clickAttr+'>'+d+'</div>';
    }
    html += '</div>';
    html += '<div class="cal-legend">'
      + '<span><span class="cal-dot paid"></span>Pagado (toca para ver el detalle)</span>'
      + (evaluaMora ? '<span><span class="cal-dot miss"></span>Sin pago (toca para registrarlo)</span>' : '')
      + '<span><span class="cal-dot blank"></span>Sin registro</span>'
      + '</div>';
    if(!evaluaMora){
      html += '<div class="owner-only-note" style="margin-top:-8px;">'+(m.estado==='rentada'
        ? 'Define la "Fecha de inicio de renta" al editar la moto para marcar en rojo los días sin pago.'
        : 'La moto no está "Rentada" ahora, así que no se marcan días sin pago. Los pagos que sí se registraron se ven en verde.')+'</div>';
    }

    // Lista de pagos del mes: lo que se puede revisar uno por uno.
    var pagos = [];
    Object.keys(paidSet).sort().forEach(function(iso){
      rentaDelDia(motoId, iso).forEach(function(p){ pagos.push({fecha:iso, cobrado:p.cobrado, renta:p.renta}); });
    });
    var totalMes = pagos.reduce(function(a,p){return a+p.cobrado;},0);
    var diasPagados = Object.keys(paidSet).length;
    var diasSinPago = Object.keys(missedSet).length;
    html += '<div class="stat-list" style="margin-top:4px;">'
      + statRow('Días pagados en '+new Date(mk+'-02').toLocaleDateString('es-CO',{month:'long'}), diasPagados+' día(s)', 'pos')
      + (evaluaMora ? statRow('Días sin pago', diasSinPago+' día(s)', diasSinPago?'neg':'') : '')
      + statRowTotal('Total cobrado en renta', fmtMoney(totalMes), 'pos')
      + '</div>';
    if(pagos.length){
      html += '<div class="list" id="calPagosList">' + pagos.map(function(p){
        var reg = p.renta.createdAt ? new Date(p.renta.createdAt).toLocaleString('es-CO',{timeZone:'America/Bogota',day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'}) : '';
        return '<div class="row-card" id="pago-'+p.fecha+'"><div class="main">'
          + '<div class="title">'+fmtDate(p.fecha)+'</div>'
          + '<div class="meta">'+(reg?('Registrado '+reg):'')+(p.renta.nota?(' · '+escapeHtml(p.renta.nota)):'')+'</div></div>'
          + '<div class="amount pos">+'+fmtMoney(p.cobrado)+'</div></div>';
      }).join('') + '</div>';
    }
    return html;
  }

  function generalStats(){
    var movs = state.movimientos.filter(function(m){return !m.motoId;});
    var ingresos = movs.filter(function(m){return m.tipo==='ingreso';}).reduce(function(a,m){return a+Number(m.monto||0);},0);
    var gastos = movs.filter(function(m){return m.tipo==='gasto';}).reduce(function(a,m){return a+Number(m.monto||0);},0);
    return { movs:movs, ingresos:ingresos, gastos:gastos, balance:ingresos-gastos };
  }

  // Todo lo que suma o resta en el saldo de un mes, en una sola lista: ingresos y
  // gastos de Finanzas + costos de la pestaña Mantenimiento. Resumen y Finanzas
  // usan esta misma función, así que ya no pueden mostrar cifras distintas.
  function monthItems(mk, cuenta){
    var items = [];
    cuenta = cuenta || '';
    state.movimientos.forEach(function(m){
      if(monthKey(m.fecha)!==mk) return;
      if(cuentaDeMov(m)!==cuenta) return;
      if(m.tipo!=='ingreso' && m.tipo!=='gasto') return; // la nómina separada no entra al saldo
      items.push({ id:m.id, kind:'mov', signo:(m.tipo==='ingreso'?1:-1), monto:Number(m.monto||0), fecha:m.fecha,
        titulo:m.categoria||(m.tipo==='ingreso'?'Ingreso':'Gasto'), motoId:m.motoId||null, placa:m.motoPlaca||(motoById(m.motoId)||{}).placa||null,
        nota:m.nota||'', createdAt:Number(m.createdAt||0), fuente:'Finanzas', raw:m });
    });
    state.mantenimientos.forEach(function(mt){
      if(monthKey(mt.fecha)!==mk) return;
      if(cuentaDeMant(mt)!==cuenta) return;
      var c = Number(mt.costo||0); if(!c) return;
      items.push({ id:mt.id, kind:'mant', signo:-1, monto:c, fecha:mt.fecha, titulo:mt.tipo||'Mantenimiento',
        motoId:mt.motoId||null, placa:mt.motoPlaca||null, nota:mt.notas||'', createdAt:Number(mt.createdAt||0), fuente:'Mantenimiento', raw:mt });
    });
    items.sort(function(a,b){ return (b.fecha||'').localeCompare(a.fecha||'') || (b.createdAt-a.createdAt); });
    var ingresos = 0, gastos = 0;
    items.forEach(function(it){ if(it.signo>0) ingresos += it.monto; else gastos += it.monto; });
    return { items:items, ingresos:ingresos, gastos:gastos, neto:ingresos-gastos };
  }

  // Revisa los registros del mes buscando lo que suele descuadrar el saldo.
  function monthWarnings(mk, items){
    var out = [];
    var mants = items.filter(function(i){return i.kind==='mant';});
    var gastosMant = items.filter(function(i){return i.kind==='mov' && i.signo<0 && /manten|repuest|aceite|llanta|freno/i.test(i.titulo+' '+i.nota);});
    mants.forEach(function(mt){
      gastosMant.forEach(function(g){
        if(g.motoId===mt.motoId && (g.monto===mt.monto || g.fecha===mt.fecha)){
          out.push('<b>Posible gasto cobrado dos veces</b>'+escapeHtml(mt.placa||'')+': "'+escapeHtml(mt.titulo)+'" de '+fmtMoney(mt.monto)+' está en Mantenimiento, y hay un gasto "'+escapeHtml(g.titulo)+'" de '+fmtMoney(g.monto)+' en Finanzas ('+fmtDate(g.fecha)+'). Si son el mismo, borra uno de los dos.');
        }
      });
    });
    // Mismo monto, misma moto, misma fecha, mismo tipo: casi seguro un doble registro.
    var seen = {};
    items.forEach(function(it){
      var k = it.kind+'|'+it.signo+'|'+(it.motoId||'-')+'|'+it.fecha+'|'+it.monto+'|'+it.titulo;
      if(seen[k]) out.push('<b>Registro repetido</b>'+escapeHtml(it.titulo)+' de '+fmtMoney(it.monto)+' el '+fmtDate(it.fecha)+(it.placa?(' ('+escapeHtml(it.placa)+')'):'')+' aparece dos veces.');
      seen[k] = true;
    });
    // Nómina pagada como gasto: los $5.000 diarios ya se descontaron de cada renta.
    items.forEach(function(it){
      if(it.kind==='mov' && it.signo<0 && /n[oó]mina|sueldo|salario|pago encargado|administraci/i.test(it.titulo+' '+it.nota)){
        out.push('<b>¿Nómina registrada como gasto?</b>'+fmtMoney(it.monto)+' ('+escapeHtml(it.titulo)+(it.nota?(': '+escapeHtml(it.nota)):'')+', '+fmtDate(it.fecha)+'). La nómina ya se separa sola de cada renta ('+fmtMoney(ADMIN_DIARIO)+' por día). Si además la registras como gasto, se descuenta dos veces.');
      }
    });
    // Gastos registrados en un mes pero con fecha de otro (fecha mal puesta).
    items.forEach(function(it){
      if(it.signo<0 && it.createdAt){
        var reg = new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bogota',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(it.createdAt));
        if(reg.slice(0,7)!==monthKey(it.fecha) && reg < it.fecha){
          out.push('<b>Gasto con fecha adelantada</b>'+escapeHtml(it.titulo)+' de '+fmtMoney(it.monto)+' se registró el '+fmtDate(reg)+' pero tiene fecha '+fmtDate(it.fecha)+', por eso cuenta en este mes. Si fue un error, corrige la fecha.');
        }
      }
    });
    return out;
  }

  function renderDesglose(mk, open, cuenta){
    var r = monthItems(mk, cuenta);
    var warns = monthWarnings(mk, r.items);
    var html = '<details class="desglose"'+(open?' open':'')+'><summary><span>¿De dónde sale este saldo?</span><span class="chev">'+r.items.length+' registro(s)'+(warns.length?(' · '+warns.length+' a revisar'):'')+'</span></summary><div class="body">';
    warns.forEach(function(w){ html += '<div class="warn-box">'+w+'</div>'; });
    if(r.items.length===0){
      html += '<div class="owner-only-note" style="margin:0;">No hay nada registrado con fecha de este mes. El saldo arranca en $0 cada mes.</div>';
    } else {
      r.items.forEach(function(it){
        var reg = it.createdAt ? new Date(it.createdAt).toLocaleString('es-CO',{timeZone:'America/Bogota',day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'}) : '';
        html += '<div class="dg-row"><div class="main"><div class="t">'+escapeHtml(it.titulo)+'<span class="dg-src">'+it.fuente+'</span></div>'
          + '<div class="m">'+fmtDate(it.fecha)+' · '+(it.placa?escapeHtml(it.placa):'General')+(it.nota?(' · '+escapeHtml(it.nota)):'')+(reg?(' · registrado '+reg):'')+'</div></div>'
          + '<div class="amt '+(it.signo>0?'pos':'neg')+'">'+(it.signo>0?'+':'−')+fmtMoney(it.monto)+'</div></div>';
      });
      html += '<div class="dg-total"><span>Ingresos '+fmtMoney(r.ingresos)+' − Gastos '+fmtMoney(r.gastos)+'</span><span style="color:'+(r.neto>=0?'var(--success)':'var(--danger)')+'">'+fmtMoney(r.neto)+'</span></div>';
      html += '<div class="owner-only-note" style="margin:8px 0 0;">El saldo del mes arranca en $0: no arrastra lo del mes anterior. Si hoy se registra un gasto antes que las rentas, el mes se ve en negativo hasta que entren las rentas. La nómina ('+fmtMoney(ADMIN_DIARIO)+' por renta) no aparece aquí porque se aparta antes.</div>';
    }
    html += '</div></details>';
    return html;
  }

  // ---------- render root ----------
  function render(){
    refreshToday();
    var view = document.getElementById('view');
    if(state.tab==='resumen') view.innerHTML = renderResumen();
    else if(state.tab==='finanzas') view.innerHTML = renderFinanzas();
    else if(state.tab==='motos') view.innerHTML = renderMotos();
    else if(state.tab==='mantenimiento') view.innerHTML = renderMantenimiento();
    else if(state.tab==='gps') view.innerHTML = renderGps();
    else if(state.tab==='supervision') view.innerHTML = isOwnerView ? renderSupervision() : '<div class="empty">No tienes acceso a esta sección.</div>';
    renderFab();
    wireView();
  }

  // ---------- RESUMEN ----------
  function renderResumen(){
    // Resumen = solo las cuentas de RZ Rentas. Las motos de otros propietarios
    // se ven aparte (tarjeta "Cuentas aparte" y en Finanzas).
    var motosRZ = state.motos.filter(function(m){ return !cuentaDeMoto(m); });
    var movsRZ = state.movimientos.filter(function(m){ return cuentaDeMov(m)===''; });
    var mantsRZ = state.mantenimientos.filter(function(mt){ return cuentaDeMant(mt)===''; });
    var movMes = movsRZ.filter(function(m){return monthKey(m.fecha)===state.viewMonth && (m.tipo==='ingreso'||m.tipo==='gasto');});
    var mantMes = mantsRZ.filter(function(mt){return monthKey(mt.fecha)===state.viewMonth;}).reduce(function(a,mt){return a+Number(mt.costo||0);},0);
    var resumenMes = monthItems(state.viewMonth, '');
    var ingresos = resumenMes.ingresos, gastos = resumenMes.gastos, neto = resumenMes.neto;
    var disponibles = motosRZ.filter(function(m){return m.estado==='disponible';}).length;
    var total = motosRZ.length;

    var histMant = mantsRZ.reduce(function(a,mt){return a+Number(mt.costo||0);},0);
    var histIngresos = movsRZ.filter(function(m){return m.tipo==='ingreso';}).reduce(function(a,m){return a+Number(m.monto||0);},0);
    var histGastos = movsRZ.filter(function(m){return m.tipo==='gasto';}).reduce(function(a,m){return a+Number(m.monto||0);},0) + histMant;

    var alertasPend = state.alertas.filter(function(a){return !a.atendida;})
      .sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'');}).slice(0,4);

    var vtos = [];
    state.mantenimientos.forEach(function(mt){
      if(mt.proximoVencimiento){
        var d = daysUntil(mt.proximoVencimiento);
        if(d!==null && d<=30) vtos.push({mt:mt, dias:d});
      }
    });
    vtos.sort(function(a,b){return a.dias-b.dias;});

    var html = '';
    html += renderMonthNav();
    html += '<div class="cards-grid">';
    html += card('Ingresos del mes', fmtMoney(ingresos), 'pos');
    html += card('Gastos del mes', fmtMoney(gastos), 'neg');
    html += '<div class="card wide"><div class="label">Rentabilidad del mes</div>'
          + '<div class="value '+(neto>=0?'pos':'neg')+'">'+fmtMoney(neto)+'</div>'
          + '<div class="sub">'+movMes.length+' movimiento(s) financiero(s)'+(mantMes>0?(' + '+fmtMoney(mantMes)+' en mantenimiento'):'')+' este mes</div></div>';
    html += '<div class="card wide"><div class="label">Flota</div>'
          + '<div class="value">'+disponibles+' / '+total+'</div>'
          + '<div class="sub">motos de RZ disponibles'+(state.motos.length>total?(' · '+(state.motos.length-total)+' moto(s) de otros propietarios no se cuentan aquí'):'')+'</div></div>';
    var gGenMes = movMes.filter(function(m){return !m.motoId && m.tipo==='gasto';}).reduce(function(a,m){return a+Number(m.monto||0);},0);
    html += '<div class="card wide"><div class="label">Gastos generales del mes</div>'
          + '<div class="value neg">'+fmtMoney(gGenMes)+'</div>'
          + '<div class="sub">gastos no asociados a una moto en particular (administrativos, etc.)</div></div>';
    html += '<div class="card wide"><div class="label">Total histórico (todos los meses)</div>'
          + '<div class="value '+(histIngresos-histGastos>=0?'pos':'neg')+'">'+fmtMoney(histIngresos-histGastos)+'</div>'
          + '<div class="sub">Ingresos '+fmtMoney(histIngresos)+' · Gastos '+fmtMoney(histGastos)+' desde que empezaste a usar el panel</div></div>';
    html += '</div>';
    html += renderDesglose(state.viewMonth, neto<0, '');
    cuentasTerceros().forEach(function(c){
      var rc = monthItems(state.viewMonth, c);
      var nMotos = state.motos.filter(function(m){ return cuentaDeMoto(m)===c; }).length;
      html += '<div class="row-card tap" data-go-cuenta="'+escapeHtml(c)+'" style="margin-top:10px;"><div class="main">'
        + '<div class="title">Cuenta aparte · '+escapeHtml(c)+'</div>'
        + '<div class="meta">'+nMotos+' moto(s) · Ingresos '+fmtMoney(rc.ingresos)+' · Gastos '+fmtMoney(rc.gastos)+' · no se suma a RZ. Toca para ver su cuenta.</div></div>'
        + '<div class="amount" style="color:'+(rc.neto>=0?'var(--success)':'var(--danger)')+'">'+fmtMoney(rc.neto)+'</div></div>';
    });
    var recPend = recurrentesDelMes(state.viewMonth, '').filter(function(x){return !x.pago;});
    if(recPend.length){
      var vencidos = recPend.filter(function(x){return x.vencido;}).length;
      html += '<div class="row-card tap" id="goRecurrentes" style="margin-top:10px;"><div class="main">'
        + '<div class="title">Gastos fijos sin registrar: '+recPend.length+'</div>'
        + '<div class="meta">'+fmtMoney(recPend.reduce(function(a,x){return a+Number(x.rec.monto||0);},0))+(vencidos?(' · '+vencidos+' ya vencido(s)'):'')+' · toca para registrarlos en Finanzas</div></div>'
        + '<span class="pill '+(vencidos?'bad':'warn')+'">Pendiente</span></div>';
    }

    html += '<div class="section-title">Balance por moto — '+new Date(state.viewMonth+'-02').toLocaleDateString('es-CO',{month:'long'})+'</div>';
    if(motosRZ.length===0){
      html += '<div class="empty">Aún no tienes motos registradas.</div>';
    } else {
      html += '<div class="list">' + motosRZ.map(function(m){
        var s = computeMotoStatsForMonth(m.id, state.viewMonth);
        return '<div class="moto-balance-row" data-open-moto="'+m.id+'">'
          + '<div class="main"><div class="title">'+escapeHtml(m.placa)+'</div>'
          + '<div class="meta">Renta '+fmtMoney(s.ingresos)+' · Gastos '+fmtMoney(s.gastos)+'</div></div>'
          + '<div class="amount" style="color:'+(s.balance>=0?'var(--success)':'var(--danger)')+'">'+fmtMoney(s.balance)+'</div>'
          + '</div>';
      }).join('') + '</div>';
    }

    html += '<div class="section-title">Alertas sin atender</div>';
    if(alertasPend.length===0){
      html += '<div class="empty">Sin alertas pendientes.</div>';
    } else {
      html += '<div class="list">' + alertasPend.map(function(a){
        var m = motoById(a.motoId);
        var placa = a.motoPlaca||(m?m.placa:'Moto');
        var msg = 'Alerta '+labelTipoAlerta(a.tipo)+' — Moto '+placa+(a.descripcion?(': '+a.descripcion):'')+' ('+fmtDate(a.fecha)+')';
        return '<div class="row-card"><div class="main">'
          + '<div class="title">'+escapeHtml(placa)+' · '+labelTipoAlerta(a.tipo)+'</div>'
          + '<div class="meta">'+escapeHtml(a.descripcion||'')+' · '+fmtDate(a.fecha)+'</div></div>'
          + '<span class="pill bad">Pendiente</span>' + waBtn(msg) + '</div>';
      }).join('') + '</div>';
    }

    html += '<div class="section-title">Próximos vencimientos (30 días)</div>';
    if(vtos.length===0){
      html += '<div class="empty">No hay vencimientos próximos registrados.</div>';
    } else {
      html += '<div class="list">' + vtos.map(function(v){
        var m = motoById(v.mt.motoId);
        var placa = v.mt.motoPlaca||(m?m.placa:'Moto');
        var pill = v.dias<0 ? '<span class="pill bad">Vencido</span>' : (v.dias<=7 ? '<span class="pill warn">'+v.dias+' d</span>' : '<span class="pill ok">'+v.dias+' d</span>');
        var msg = 'Recordatorio: la moto '+placa+' tiene '+v.mt.tipo+' con vencimiento el '+fmtDate(v.mt.proximoVencimiento)+'.';
        return '<div class="row-card"><div class="main">'
          + '<div class="title">'+escapeHtml(placa)+' · '+escapeHtml(v.mt.tipo)+'</div>'
          + '<div class="meta">Vence '+fmtDate(v.mt.proximoVencimiento)+'</div></div>' + pill + waBtn(msg) + '</div>';
      }).join('') + '</div>';
    }
    return html;
  }
  function card(label, value, cls){
    return '<div class="card"><div class="label">'+label+'</div><div class="value '+(cls||'')+'">'+value+'</div></div>';
  }
  function labelTipoAlerta(t){
    return t==='zona' ? 'Salida de zona' : t==='horario' ? 'Horario inusual' : 'Alerta';
  }

          + (isOwnerView ? '<button class="del" data-del-mov="'+m.id+'" aria-label="Eliminar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h10l1-13"/></svg></button>' : '')

  // ---------- MOTOS ----------
  function estadoPill(estado){
    if(estado==='disponible') return '<span class="pill ok">Disponible</span>';
    if(estado==='rentada') return '<span class="pill warn">Rentada</span>';
    if(estado==='mantenimiento') return '<span class="pill bad">En mantenimiento</span>';
    return '<span class="pill muted">'+escapeHtml(estado||'—')+'</span>';
  }
  function renderMotos(){
    var html = '';
    if(state.motos.length===0){
      html += '<div class="section-title">Inventario (0)</div>';
      html += '<div class="empty"><b>Aún no tienes motos registradas</b>Agrega tu primera moto con el botón +.</div>';
      return html;
    }
    [''].concat(cuentasTerceros()).forEach(function(c){
      var grupo = state.motos.filter(function(m){ return cuentaDeMoto(m)===c; });
      if(!grupo.length) return;
      html += '<div class="section-title">'+(c?('Motos de '+escapeHtml(c)+' · cuenta aparte'):'Motos de RZ Rentas')+' ('+grupo.length+')</div>';
      html += '<div class="list" style="margin-bottom:6px;">' + grupo.map(function(m){
        var st = computeMotoStats(m.id);
        var missed = computeMissedDays(m.id, currentMonth);
        return '<div class="row-card tap" data-open-moto="'+m.id+'"><div class="main">'
          + '<div class="title">'+escapeHtml(m.placa||'Sin placa')+(m.marca?(' · '+escapeHtml(m.marca)+(m.modelo?' '+escapeHtml(m.modelo):'')):'')+'</div>'
          + '<div class="meta">'+(m.tarifaDiaria?fmtMoney(m.tarifaDiaria)+'/día · ':'')+(m.kilometraje?Number(m.kilometraje).toLocaleString('es-CO')+' km':'sin km registrado')+'</div>'
          + '<div class="meta2">'+(st.compra?('Compra '+fmtMoney(st.compra)+' · '):'')+'Balance <span style="color:'+(st.balance>=0?'var(--success)':'var(--danger)')+'">'+fmtMoney(st.balance)+'</span>'+(st.recuperado!==null?(' · '+st.recuperado+'% recuperado'):'')+'</div>'
          + (function(){ var dp = depositoMoto(m.id); return (dp.total>0 || m.estado==='rentada') ? '<div class="meta2">Depósito acumulado: <b style="color:var(--accent-strong)">'+fmtMoney(dp.total)+'</b> ('+dp.dias+' día'+(dp.dias===1?'':'s')+' pagado'+(dp.dias===1?'':'s')+')</div>' : ''; })()
          + '</div>'
          + (missed.length>0 ? '<span class="pill bad">'+missed.length+' sin pago</span>' : '')
          + estadoPill(m.estado)
          + '<button class="del" data-del-moto="'+m.id+'" aria-label="Eliminar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h10l1-13"/></svg></button>'
          + '</div>';
      }).join('') + '</div>';
    });
    return html;
  }

  // ---------- MANTENIMIENTO ----------
  function renderMantenimiento(){
    var html = motoFilterStrip();
    var list = state.mantenimientos.slice().sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'');});
    if(state.motoFilter!=='todas') list = list.filter(function(mt){return mt.motoId===state.motoFilter;});

    html += '<div class="section-title">Historial de mantenimiento</div>';
    if(state.motos.length===0){
      html += '<div class="empty"><b>Primero registra una moto</b>Ve a la pestaña Motos para agregar tu inventario.</div>';
    } else if(list.length===0){
      html += '<div class="empty"><b>Sin registros aún</b>Agrega el primer mantenimiento con el botón +.</div>';
    } else {
      html += '<div class="list">' + list.map(function(mt){
        var d = daysUntil(mt.proximoVencimiento);
        var pill = mt.proximoVencimiento ? (d<0?'<span class="pill bad">Vencido</span>':d<=7?'<span class="pill warn">'+d+' d</span>':'<span class="pill ok">'+d+' d</span>') : '';

          : ('Registro de mantenimiento — Moto '+mt.motoPlaca+': '+mt.tipo+' el '+fmtDate(mt.fecha)+(mt.costo?(' ('+fmtMoney(mt.costo)+')'):'')+'.');
        return '<div class="row-card tap" data-open-mant="'+mt.id+'"><div class="main">'
          + '<div class="title">'+escapeHtml(mt.motoPlaca)+' · '+escapeHtml(mt.tipo)+'</div>'
          + '<div class="meta">'+fmtDate(mt.fecha)+(mt.costo?(' · '+fmtMoney(mt.costo)):'')+(mt.proximoVencimiento?(' · vence '+fmtDate(mt.proximoVencimiento)):'')+(mt.notas?(' · '+escapeHtml(mt.notas)):'')+'</div></div>'
          + (mt.fotoUrl ? '<span class="photo-badge" title="Tiene foto de la factura"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></svg></span>' : '')
          + pill + waBtn(msg)
          + '<button class="del" data-del-mant="'+mt.id+'" aria-label="Eliminar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h10l1-13"/></svg></button>'
          + '</div>';
      }).join('') + '</div>';
    }
    return html;

  function motoFilterStrip(){

  }

    if(state.motos.length===0){
      html += '<div class="empty"><b>Primero registra una moto</b>Ve a la pestaña Motos para agregar tu inventario.</div>';

    html += '<div class="section-title">Reglas por moto</div>';
    html += state.motos.map(function(m){
      return '<div class="gps-block">'
        + '<div class="h"><div class="title">'+escapeHtml(m.placa)+(m.marca?(' · '+escapeHtml(m.marca)):'')+'</div>'

        + '<div class="gps-mini">'

      html += '<div class="empty">Sin alertas registradas. Usa el botón + para anotar una salida de zona u horario inusual.</div>';
    } else {
      html += '<div class="list">' + alertas.map(function(a){
        var msg = 'Alerta GPS — '+labelTipoAlerta(a.tipo)+' en la moto '+a.motoPlaca+(a.descripcion?(': '+a.descripcion):'')+' ('+fmtDate(a.fecha)+')';
        return '<div class="row-card"><div class="main">'
          + '<div class="title">'+escapeHtml(a.motoPlaca)+' · '+labelTipoAlerta(a.tipo)+'</div>'

          + '<button class="pill '+(a.atendida?'ok':'bad')+'" data-toggle-alerta="'+a.id+'" style="cursor:pointer;border:none;">'+(a.atendida?'Atendida':'Pendiente')+'</button>'
          + waBtn(msg)
          + '<button class="del" data-del-alerta="'+a.id+'" aria-label="Eliminar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h10l1-13"/></svg></button>'
          + '</div>';
      }).join('') + '</div>';
    }
    return html;
