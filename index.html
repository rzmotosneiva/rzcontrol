  var GASTO_ALTO_SIN_NOTA = 300000;

  // Alertas automáticas: se calculan de los datos compartidos (motos/movimientos),
  // así que su existencia no es secreta — solo se OCULTA la pestaña a quien no sea
  // el dueño de la app. La privacidad real (notas de "sospechoso") va en la
  // colección "supervision", protegida por reglas de la base de datos.
  function computeAutoAlerts(){
    var out = [];
    state.motos.forEach(function(m){
      var missed = computeMissedDays(m.id, currentMonth);
      if(missed.length>0){
        var mensaje = missed.length===1
          ? 'Marcada como rentada, sin renta registrada el '+fmtDate(missed[0])
          : missed.length+' días sin renta registrada este mes (desde '+fmtDate(missed[0])+')';
        out.push({tipo:'sin_pago', motoPlaca:m.placa, mensaje:mensaje, diasSinPago:missed.length});
      }
    });
    state.movimientos.forEach(function(mv){
      if(mv.tipo==='gasto' && Number(mv.monto||0)>=GASTO_ALTO_SIN_NOTA && !(mv.nota&&mv.nota.trim())){
        out.push({tipo:'gasto_sin_nota', motoPlaca:mv.motoPlaca||'General', mensaje:'Gasto de '+fmtMoney(mv.monto)+' ('+(mv.categoria||'')+') sin nota que lo justifique', movId:mv.id, fecha:mv.fecha});
      }
    });
    return out;
  }
  function supervisionDoc(movId){ return state.supervision.find(function(s){return s.id===movId;}); }

  // Días del mes en que la moto estuvo "rentada" y no se registró pago de renta.
  // El día de HOY nunca se cuenta como "en mora" (todavía puede pagarse antes de
  // que termine) — solo días anteriores ya cerrados y sin pago registrado.
  // Si no se definió fecha de inicio de renta, no hay nada que evaluar aún.
  // Días de descanso del conductor, guardados en la moto como lista de fechas.
  function esDescanso(m, iso){ return !!(m && Array.isArray(m.descansos) && m.descansos.indexOf(iso)>=0); }
  function guardarDescanso(m, iso, marcar, onDone){
    var lista = Array.isArray(m.descansos) ? m.descansos.slice() : [];
    var i = lista.indexOf(iso);
    if(marcar && i<0) lista.push(iso);
    if(!marcar && i>=0) lista.splice(i,1);
    lista.sort();
    db.doc(negocioPath('motos')+'/'+m.id).update({ descansos: lista })
      .then(function(){ m.descansos = lista; if(onDone) onDone(); })
      .catch(showSaveError);
  }

  function computeMissedDays(motoId, monthKeyStr){
    var m = motoById(motoId);
    if(!m || m.estado!=='rentada') return [];
    var today = todayISO();
    var paidDates = {};
    state.movimientos.forEach(function(mv){
      if(mv.motoId===motoId && mv.tipo==='ingreso' && mv.categoria==='Renta') paidDates[mv.fecha]=true;
    });
    if(!m.fechaInicioRenta){
      return [];
    }
    var year = Number(monthKeyStr.slice(0,4)), month = Number(monthKeyStr.slice(5,7));
    var daysInMonth = new Date(year, month, 0).getDate();
    var missed = [];
    for(var d=1; d<=daysInMonth; d++){
      var iso = monthKeyStr+'-'+(d<10?'0'+d:d);
      if(iso>=today) break;
      if(iso<m.fechaInicioRenta) continue;
      if(esDescanso(m, iso)) continue; // día de descanso del conductor: no cuenta como no pagado
      if(!paidDates[iso]) missed.push(iso);
    }
    return missed;
  }

  // Calendario de pagos de una moto para CUALQUIER mes. Los pagos nunca se
  // borran al cambiar de mes: cada renta queda guardada con su fecha, y aquí
  // se puede navegar hacia atrás para verificar día por día.
  var calMonth = null;
  function rentaDelDia(motoId, iso){
    // Junta la parte "Renta" y su parte de nómina para mostrar lo cobrado completo.
    var rentas = state.movimientos.filter(function(mv){ return mv.motoId===motoId && mv.tipo==='ingreso' && mv.categoria==='Renta' && mv.fecha===iso; });
    return rentas.map(function(r){
      var extra = state.movimientos.filter(function(mv){ return (mv.tipo==='nomina' || (mv.tipo==='deposito' && mv.categoria==='Depósito reembolsable')) && mv.motoId===motoId && mv.fecha===iso && mv.createdAt===r.createdAt; })
        .reduce(function(a,mv){ return a+Number(mv.monto||0); },0);
      return { renta:r, cobrado:Number(r.monto||0)+extra };
    });
  }
  function renderMotoCalendar(motoId){
    var m = motoById(motoId);
    var mk = calMonth || currentMonth;
    var labelMes = new Date(mk+'-02').toLocaleDateString('es-CO',{month:'long',year:'numeric'});
    var html = '<div class="section-title" style="margin-top:20px;">Calendario de pagos</div>';
    html += '<div class="month-nav">'
      + '<button data-cal-month="-1" aria-label="Mes anterior"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>'
      + '<div class="label">'+labelMes+'</div>'
      + '<button data-cal-month="1" aria-label="Mes siguiente"'+(mk>=currentMonth?' disabled':'')+'><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>'
      + '</div>';

    var evaluaMora = m.estado==='rentada' && !!m.fechaInicioRenta;
    var missedSet = {};
    if(evaluaMora) computeMissedDays(motoId, mk).forEach(function(iso){ missedSet[iso]=true; });
    var paidSet = {};
    state.movimientos.forEach(function(mv){
      if(mv.motoId===motoId && mv.tipo==='ingreso' && mv.categoria==='Renta' && monthKey(mv.fecha)===mk) paidSet[mv.fecha]=true;
    });
    var year = Number(mk.slice(0,4)), month = Number(mk.slice(5,7));
    var daysInMonth = new Date(year, month, 0).getDate();
    var firstDow = (new Date(year, month-1, 1).getDay()+6)%7; // 0=lunes
    var today = todayISO();

    html += '<div class="cal-head-row">' + ['L','M','M','J','V','S','D'].map(function(d){return '<div>'+d+'</div>';}).join('') + '</div>';
    html += '<div class="cal-grid">';
    for(var i=0;i<firstDow;i++) html += '<div class="cal-day blank"></div>';
    for(var d=1; d<=daysInMonth; d++){
      var iso = mk+'-'+(d<10?'0'+d:d);
      var cls = 'cal-day';
      var clickAttr = '';
      var puedeMarcar = m.estado==='rentada' && (!m.fechaInicioRenta || iso>=m.fechaInicioRenta);
      if(paidSet[iso] && iso<=today){ cls += ' paid clickable'; clickAttr = ' data-cal-info="'+iso+'"'; }
      else if(esDescanso(m, iso)){ cls += ' rest clickable'; clickAttr = ' data-cal-dia="'+iso+'"'; }
      else if(missedSet[iso]){ cls += ' miss clickable'; clickAttr = ' data-cal-dia="'+iso+'"'; }
      else if(puedeMarcar && iso>=today){ cls += ' blank clickable'; clickAttr = ' data-cal-dia="'+iso+'"'; }
      else if(iso>today) cls += ' blank';
      if(iso===today) cls += ' today';
      if(esFestivo(iso)){ cls += ' fest'; if(!clickAttr && iso<=today) { cls += ' clickable'; clickAttr = ' data-cal-dia="'+iso+'"'; } }
      html += '<div class="'+cls+'"'+clickAttr+'>'+d+'</div>';
    }
    html += '</div>';
    html += '<div class="cal-legend">'
      + '<span><span class="cal-dot paid"></span>Pagado (toca para ver el detalle)</span>'
      + (evaluaMora ? '<span><span class="cal-dot miss"></span>Sin pago (toca para registrar pago o descanso)</span>' : '')
      + '<span><span class="cal-dot rest"></span>Descanso del conductor</span>'
      + '<span><span class="cal-dot fest"></span>Festivo ('+fmtMoney(TARIFA_FESTIVO)+', sin depósito)</span>'
      + '<span><span class="cal-dot blank"></span>Sin registro</span>'
      + '</div>';
    if(!evaluaMora){
      html += '<div class="owner-only-note" style="margin-top:-8px;">'+(m.estado==='rentada'
        ? 'Define la "Fecha de inicio de renta" al editar la moto para marcar en rojo los días sin pago.'
        : 'La moto no está "Rentada" ahora, así que no se marcan días sin pago. Los pagos que sí se registraron se ven en verde.')+'</div>';
    }

    // Lista de pagos del mes: lo que se puede revisar uno por uno.
    var pagos = [];
    Object.keys(paidSet).sort().forEach(function(iso){
      rentaDelDia(motoId, iso).forEach(function(p){ pagos.push({fecha:iso, cobrado:p.cobrado, renta:p.renta}); });
    });
    var totalMes = pagos.reduce(function(a,p){return a+p.cobrado;},0);
    var diasPagados = Object.keys(paidSet).length;
    var diasSinPago = Object.keys(missedSet).length;
    var diasDescanso = (Array.isArray(m.descansos)?m.descansos:[]).filter(function(f){ return monthKey(f)===mk && f<=today; }).length;
    html += '<div class="stat-list" style="margin-top:4px;">'
      + statRow('Días pagados en '+new Date(mk+'-02').toLocaleDateString('es-CO',{month:'long'}), diasPagados+' día(s)', 'pos')
      + (evaluaMora ? statRow('Días sin pago', diasSinPago+' día(s)', diasSinPago?'neg':'') : '')
      + (diasDescanso ? statRow('Días de descanso', diasDescanso+' día(s)') : '')
      + statRowTotal('Total cobrado en renta', fmtMoney(totalMes), 'pos')
      + '</div>';
    if(pagos.length){
      html += '<div class="list" id="calPagosList">' + pagos.map(function(p){
        var reg = p.renta.createdAt ? new Date(p.renta.createdAt).toLocaleString('es-CO',{timeZone:'America/Bogota',day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'}) : '';
        return '<div class="row-card" id="pago-'+p.fecha+'"><div class="main">'
          + '<div class="title">'+fmtDate(p.fecha)+'</div>'
          + '<div class="meta">'+(reg?('Registrado '+reg):'')+(p.renta.nota?(' · '+escapeHtml(p.renta.nota)):'')+'</div></div>'
          + '<div class="amount pos">+'+fmtMoney(p.cobrado)+'</div></div>';
      }).join('') + '</div>';
    }
    return html;
  }

  function generalStats(){
    var movs = state.movimientos.filter(function(m){return !m.motoId;});
    var ingresos = movs.filter(function(m){return m.tipo==='ingreso';}).reduce(function(a,m){return a+Number(m.monto||0);},0);
    var gastos = movs.filter(function(m){return m.tipo==='gasto';}).reduce(function(a,m){return a+Number(m.monto||0);},0);
    return { movs:movs, ingresos:ingresos, gastos:gastos, balance:ingresos-gastos };
  }

  // Todo lo que suma o resta en el saldo de un mes, en una sola lista: ingresos y
  // gastos de Finanzas + costos de la pestaña Mantenimiento. Resumen y Finanzas
  // usan esta misma función, así que ya no pueden mostrar cifras distintas.
  function monthItems(mk, cuenta){
    var items = [];
    cuenta = cuenta || '';
    state.movimientos.forEach(function(m){
      if(monthKey(m.fecha)!==mk) return;
      if(cuentaDeMov(m)!==cuenta) return;
      if(m.tipo!=='ingreso' && m.tipo!=='gasto') return; // la nómina separada no entra al saldo
      items.push({ id:m.id, kind:'mov', signo:(m.tipo==='ingreso'?1:-1), monto:Number(m.monto||0), fecha:m.fecha,
        titulo:m.categoria||(m.tipo==='ingreso'?'Ingreso':'Gasto'), motoId:m.motoId||null, placa:m.motoPlaca||(motoById(m.motoId)||{}).placa||null,
        nota:m.nota||'', createdAt:Number(m.createdAt||0), fuente:'Finanzas', raw:m });
    });
    state.mantenimientos.forEach(function(mt){
      if(monthKey(mt.fecha)!==mk) return;
      if(cuentaDeMant(mt)!==cuenta) return;
      var c = Number(mt.costo||0); if(!c) return;
      items.push({ id:mt.id, kind:'mant', signo:-1, monto:c, fecha:mt.fecha, titulo:mt.tipo||'Mantenimiento',
        motoId:mt.motoId||null, placa:mt.motoPlaca||null, nota:mt.notas||'', createdAt:Number(mt.createdAt||0), fuente:'Mantenimiento', raw:mt });
    });
    items.sort(function(a,b){ return (b.fecha||'').localeCompare(a.fecha||'') || (b.createdAt-a.createdAt); });
    var ingresos = 0, gastos = 0;
    items.forEach(function(it){ if(it.signo>0) ingresos += it.monto; else gastos += it.monto; });
    return { items:items, ingresos:ingresos, gastos:gastos, neto:ingresos-gastos };
  }

  // Revisa los registros del mes buscando lo que suele descuadrar el saldo.
  function monthWarnings(mk, items){
    var out = [];
    var mants = items.filter(function(i){return i.kind==='mant';});
    var gastosMant = items.filter(function(i){return i.kind==='mov' && i.signo<0 && /manten|repuest|aceite|llanta|freno/i.test(i.titulo+' '+i.nota);});
    mants.forEach(function(mt){
      gastosMant.forEach(function(g){
        if(g.motoId===mt.motoId && (g.monto===mt.monto || g.fecha===mt.fecha)){
          out.push('<b>Posible gasto cobrado dos veces</b>'+escapeHtml(mt.placa||'')+': "'+escapeHtml(mt.titulo)+'" de '+fmtMoney(mt.monto)+' está en Mantenimiento, y hay un gasto "'+escapeHtml(g.titulo)+'" de '+fmtMoney(g.monto)+' en Finanzas ('+fmtDate(g.fecha)+'). Si son el mismo, borra uno de los dos.');
        }
      });
    });
    // Mismo monto, misma moto, misma fecha, mismo tipo: casi seguro un doble registro.
    var seen = {};
    items.forEach(function(it){
      var k = it.kind+'|'+it.signo+'|'+(it.motoId||'-')+'|'+it.fecha+'|'+it.monto+'|'+it.titulo;
      if(seen[k]) out.push('<b>Registro repetido</b>'+escapeHtml(it.titulo)+' de '+fmtMoney(it.monto)+' el '+fmtDate(it.fecha)+(it.placa?(' ('+escapeHtml(it.placa)+')'):'')+' aparece dos veces.');
      seen[k] = true;
    });
    // Nómina pagada como gasto: los $5.000 diarios ya se descontaron de cada renta.
    items.forEach(function(it){
      if(it.kind==='mov' && it.signo<0 && /n[oó]mina|sueldo|salario|pago encargado|administraci/i.test(it.titulo+' '+it.nota)){
        out.push('<b>¿Nómina registrada como gasto?</b>'+fmtMoney(it.monto)+' ('+escapeHtml(it.titulo)+(it.nota?(': '+escapeHtml(it.nota)):'')+', '+fmtDate(it.fecha)+'). La nómina ya se separa sola de cada renta ('+fmtMoney(ADMIN_DIARIO)+' por día). Si además la registras como gasto, se descuenta dos veces.');
      }
    });
    // Gastos registrados en un mes pero con fecha de otro (fecha mal puesta).
    items.forEach(function(it){
      if(it.signo<0 && it.createdAt){
        var reg = new Intl.DateTimeFormat('en-CA',{timeZone:'America/Bogota',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(it.createdAt));
        if(reg.slice(0,7)!==monthKey(it.fecha) && reg < it.fecha){
          out.push('<b>Gasto con fecha adelantada</b>'+escapeHtml(it.titulo)+' de '+fmtMoney(it.monto)+' se registró el '+fmtDate(reg)+' pero tiene fecha '+fmtDate(it.fecha)+', por eso cuenta en este mes. Si fue un error, corrige la fecha.');
        }
      }
    });
    return out;
  }

  function renderDesglose(mk, open, cuenta){
    var r = monthItems(mk, cuenta);
    var warns = monthWarnings(mk, r.items);
    var html = '<details class="desglose"'+(open?' open':'')+'><summary><span>¿De dónde sale este saldo?</span><span class="chev">'+r.items.length+' registro(s)'+(warns.length?(' · '+warns.length+' a revisar'):'')+'</span></summary><div class="body">';
    warns.forEach(function(w){ html += '<div class="warn-box">'+w+'</div>'; });
    if(r.items.length===0){
      html += '<div class="owner-only-note" style="margin:0;">No hay nada registrado con fecha de este mes. El saldo arranca en $0 cada mes.</div>';
    } else {
      r.items.forEach(function(it){
        var reg = it.createdAt ? new Date(it.createdAt).toLocaleString('es-CO',{timeZone:'America/Bogota',day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'}) : '';
        html += '<div class="dg-row"><div class="main"><div class="t">'+escapeHtml(it.titulo)+'<span class="dg-src">'+it.fuente+'</span></div>'
          + '<div class="m">'+fmtDate(it.fecha)+' · '+(it.placa?escapeHtml(it.placa):'General')+(it.nota?(' · '+escapeHtml(it.nota)):'')+(reg?(' · registrado '+reg):'')+'</div></div>'
          + '<div class="amt '+(it.signo>0?'pos':'neg')+'">'+(it.signo>0?'+':'−')+fmtMoney(it.monto)+'</div></div>';
      });
      html += '<div class="dg-total"><span>Ingresos <span style="color:var(--success)">'+fmtMoney(r.ingresos)+'</span> − Gastos <span style="color:var(--danger)">'+fmtMoney(r.gastos)+'</span></span><span style="color:'+(r.neto>=0?'var(--success)':'var(--danger)')+'">'+fmtMoney(r.neto)+'</span></div>';
      html += '<div class="owner-only-note" style="margin:8px 0 0;">El saldo del mes arranca en $0: no arrastra lo del mes anterior. Si hoy se registra un gasto antes que las rentas, el mes se ve en negativo hasta que entren las rentas. La nómina ('+fmtMoney(ADMIN_DIARIO)+' por renta) no aparece aquí porque se aparta antes.</div>';
    }
    html += '</div></details>';
    return html;
  }

  // ---------- render root ----------
  function render(){
    refreshToday();
    var view = document.getElementById('view');
    if(state.tab==='resumen') view.innerHTML = renderResumen();
    else if(state.tab==='finanzas') view.innerHTML = renderFinanzas();
    else if(state.tab==='motos') view.innerHTML = renderMotos();
    else if(state.tab==='mantenimiento') view.innerHTML = renderMantenimiento();
    else if(state.tab==='gps') view.innerHTML = renderGps();
    else if(state.tab==='supervision') view.innerHTML = isOwnerView ? renderSupervision() : '<div class="empty">No tienes acceso a esta sección.</div>';
    renderFab();
    wireView();
  }

  // ---------- RESUMEN ----------
  // Pensado para leerse en 10 segundos: cuánto quedó este mes, qué necesita
  // atención y cómo va cada moto. El detalle está en Finanzas (libro contable).
  function renderResumen(){
    var motosRZ = state.motos.filter(function(m){ return !cuentaDeMoto(m); });
    var r = monthItems(state.viewMonth, '');
    var nombreMes = new Date(state.viewMonth+'-02').toLocaleDateString('es-CO',{month:'long'});

    var html = renderMonthNav();
    html += '<div class="big-saldo"><div class="label">Lo que quedó en '+nombreMes+'</div>'
      + '<div class="value '+(r.neto>=0?'pos':'neg')+'">'+fmtMoney(r.neto)+'</div>'
      + '<div class="line"><span>Entró <b class="pos">'+fmtMoney(r.ingresos)+'</b></span><span>Salió <b class="neg ver-gastos"'+gastosAttr('', 'mes', '')+'>'+fmtMoney(r.gastos)+'</b></span></div></div>';
    // Plata apartada: nómina (solo el dueño la ve) y depósitos por devolver
    html += '<div class="cards-grid" style="margin-bottom:12px;">'
      + (isOwnerView ? card('Nómina acumulada', fmtMoney(nominaAcumulada()), '') : '')
      + '<div class="card'+(isOwnerView?'':' wide')+'"><div class="label">Depósitos por devolver</div><div class="value">'+fmtMoney(depositosEnCustodia(''))+'</div><div class="sub">Suma de todas las motos de RZ</div></div>'
      + '</div>';
    var rentadas = motosRZ.filter(function(m){return m.estado==='rentada';}).length;
    var hist = libroItems('', 'todo', '');
    html += '<div class="stat-list" style="margin-bottom:12px;">'
      + statRow('Motos de RZ', rentadas+' rentada(s) de '+motosRZ.length)
      + statRow('Ganancia desde el principio', fmtMoney(hist.neto), hist.neto>=0?'pos':'neg')
      + '</div>';

    // Lo que necesita atención (solo aparece si hay algo)
    var aten = [];
    if(state.viewMonth===currentMonth){
      motosRZ.forEach(function(m){
        if(m.estado!=='rentada' || !m.fechaInicioRenta) return;
        var miss = computeMissedDays(m.id, state.viewMonth);
        if(miss.length) aten.push('<div class="row-card tap" data-open-moto="'+m.id+'"><div class="main"><div class="title">'+escapeHtml(m.placa)+' · '+miss.length+' día(s) sin pago este mes</div><div class="meta">Último sin pago: '+fmtDate(miss[miss.length-1])+' · toca para ver el calendario</div></div><span class="pill bad">Atraso</span></div>');
      });
    }
    var recPend = recurrentesDelMes(state.viewMonth, '').filter(function(x){return !x.pago;});
    if(recPend.length){
      var vencidos = recPend.filter(function(x){return x.vencido;}).length;
      aten.push('<div class="row-card tap" id="goRecurrentes"><div class="main"><div class="title">Gastos fijos sin registrar: '+recPend.length+'</div>'
        + '<div class="meta">'+fmtMoney(recPend.reduce(function(a,x){return a+Number(x.rec.monto||0);},0))+(vencidos?(' · '+vencidos+' vencido(s)'):'')+' · toca para registrarlos</div></div>'
        + '<span class="pill '+(vencidos?'bad':'warn')+'">Pendiente</span></div>');
    }
    state.mantenimientos.forEach(function(mt){
      if(!mt.proximoVencimiento || cuentaDeMant(mt)!=='') return;
      var d = daysUntil(mt.proximoVencimiento);
      if(d===null || d>15) return;
      aten.push('<div class="row-card tap" data-open-mant="'+mt.id+'"><div class="main"><div class="title">'+escapeHtml(mt.motoPlaca||'Moto')+' · '+escapeHtml(mt.tipo||'Mantenimiento')+'</div><div class="meta">Vence '+fmtDate(mt.proximoVencimiento)+'</div></div><span class="pill '+(d<0?'bad':'warn')+'">'+(d<0?'Vencido':(d+' d'))+'</span></div>');
    });
    if(isOwnerView){
      var ur2 = ultimoRespaldo(), diasR = ur2 ? Math.floor((Date.now()-ur2)/86400000) : null;
      if(diasR===null || diasR>=7) aten.push('<div class="row-card tap" id="goRespaldo"><div class="main"><div class="title">'+(diasR===null?'Haz tu primer respaldo de datos':'Último respaldo hace '+diasR+' días')+'</div><div class="meta">Toca para descargar la copia completa y guárdala en iCloud o Drive</div></div><span class="pill warn">Respaldo</span></div>');
    }
    if(aten.length){
      html += '<div class="section-title">Necesita atención</div><div class="list">'+aten.join('')+'</div>';
    }

    // Cada moto: una tabla sencilla
    html += '<div class="section-title">Cada moto en '+nombreMes+'</div>';
    if(motosRZ.length===0){
      html += '<div class="empty">Aún no tienes motos registradas.</div>';
    } else {
      var filas = motosRZ.map(function(m){
        var s = computeMotoStatsForMonth(m.id, state.viewMonth);
        return { m:m, ing:s.ingresos, gas:s.gastos, bal:s.balance };
      });
      html += '<div class="sheet-wrap"><table class="libro" style="min-width:0;"><thead><tr><th>Moto</th><th class="num entro">Entró</th><th class="num salio">Salió</th><th class="num">Quedó</th></tr></thead><tbody>'
        + filas.map(function(f){
            return '<tr class="tap" data-open-moto="'+f.m.id+'"><td><b>'+escapeHtml(f.m.placa)+'</b><span class="sub">'+escapeHtml(f.m.estado||'')+'</span></td>'
              + '<td class="num pos">'+fmtMoney(f.ing)+'</td><td class="num neg">'+(f.gas?'<span class="ver-gastos"'+gastosAttr('', 'mes', f.m.id)+'>'+fmtMoney(f.gas)+'</span>':fmtMoney(0))+'</td>'
              + '<td class="num '+(f.bal>=0?'pos':'neg')+'"><b>'+fmtMoney(f.bal)+'</b></td></tr>';
          }).join('')
        + '</tbody></table></div>';
      html += '<div class="owner-only-note" style="margin-top:-6px;">Toca una moto para ver su calendario de pagos. Los gastos generales (sin moto) solo aparecen en el total de arriba.</div>';
    }

    cuentasTerceros().forEach(function(c){
      var rc = monthItems(state.viewMonth, c);
      html += '<div class="row-card tap" data-go-cuenta="'+escapeHtml(c)+'" style="margin-top:10px;"><div class="main">'
        + '<div class="title">Cuenta aparte · '+escapeHtml(c)+'</div>'
        + '<div class="meta">No se suma a RZ · toca para ver su libro</div></div>'
        + '<div class="amount" style="color:'+(rc.neto>=0?'var(--success)':'var(--danger)')+'">'+fmtMoney(rc.neto)+'</div></div>';
    });

    html += renderDesglose(state.viewMonth, false, '');
    return html;
  }
  function card(label, value, cls){
    return '<div class="card"><div class="label">'+label+'</div><div class="value '+(cls||'')+'">'+value+'</div></div>';
  }
  function labelTipoAlerta(t){
    return t==='zona' ? 'Salida de zona' : t==='horario' ? 'Horario inusual' : 'Alerta';
  }

  // ---------- FINANZAS ----------
  // ---------- LIBRO CONTABLE ----------
  // Todos los ingresos y gastos de una cuenta como una hoja de Excel:
  // fecha, moto, concepto, entró, salió y saldo acumulado.
  function libroItems(cuenta, periodo, motoFiltro){
    var mk = state.viewMonth, yr = state.viewMonth.slice(0,4);
    function enPeriodo(f){
      if(!f) return false;
      if(periodo==='todo') return true;
      if(periodo==='anio') return f.slice(0,4)===yr;
      return monthKey(f)===mk;
    }
    function enMoto(id){
      if(!motoFiltro) return true;
      if(motoFiltro==='__general') return !id;
      return id===motoFiltro;
    }
    var items = [];
    state.movimientos.forEach(function(m){
      if(m.tipo!=='ingreso' && m.tipo!=='gasto') return;
      if(cuentaDeMov(m)!==cuenta || !enPeriodo(m.fecha) || !enMoto(m.motoId||null)) return;
      var moto = motoById(m.motoId);
      items.push({ kind:'mov', id:m.id, fecha:m.fecha, createdAt:Number(m.createdAt||0),
        placa: moto ? moto.placa : (m.motoPlaca || (m.motoId?'Moto eliminada':'General')),
        concepto: (m.categoria || (m.tipo==='ingreso'?'Ingreso':'Gasto')) + (m.festivo ? ' (festivo)' : ''), detalle: m.nota||'',
        cat: m.categoria || 'Otro gasto', foto: m.fotoUrl||null, fuente:'Finanzas',
        ingreso: m.tipo==='ingreso' ? Number(m.monto||0) : 0, gasto: m.tipo==='gasto' ? Number(m.monto||0) : 0 });
    });
    state.mantenimientos.forEach(function(mt){
      var c = Number(mt.costo||0); if(!c) return;
      if(cuentaDeMant(mt)!==cuenta || !enPeriodo(mt.fecha) || !enMoto(mt.motoId||null)) return;
      items.push({ kind:'mant', id:mt.id, fecha:mt.fecha, createdAt:Number(mt.createdAt||0),
        placa: mt.motoPlaca || 'Moto', concepto: 'Mant. · '+(mt.tipo||'Mantenimiento'), detalle: mt.notas||'',
        cat: 'Mantenimiento', foto: mt.fotoUrl||null, fuente:'Mantenimiento', tipoMant: mt.tipo||'Mantenimiento',
        ingreso:0, gasto:c });
    });
    items.sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||'') || (a.createdAt-b.createdAt); });
    var saldo = 0, ing = 0, gas = 0;
    items.forEach(function(it){ ing += it.ingreso; gas += it.gasto; saldo += it.ingreso - it.gasto; it.saldo = saldo; });
    return { items:items, ingresos:ing, gastos:gas, neto:ing-gas };
  }
  // Días sin plata (descanso del conductor o día que no pagó) para mostrarlos
  // dentro del libro. No suman ni restan: solo informan.
  function libroDias(cuenta, periodo, motoFiltro){
    if(motoFiltro==='__general') return [];
    var mk = state.viewMonth, yr = state.viewMonth.slice(0,4), today = todayISO();
    function enPeriodo(f){
      if(periodo==='todo') return true;
      if(periodo==='anio') return f.slice(0,4)===yr;
      return monthKey(f)===mk;
    }
    var out = [];
    state.motos.forEach(function(m){
      if(cuentaDeMoto(m)!==cuenta) return;
      if(motoFiltro && m.id!==motoFiltro) return;
      (Array.isArray(m.descansos)?m.descansos:[]).forEach(function(f){
        if(f<=today && enPeriodo(f)) out.push({ kind:'dia', tipoDia:'descanso', motoId:m.id, fecha:f, placa:m.placa });
      });
      if(m.estado==='rentada' && m.fechaInicioRenta){
        var meses = [], k = monthKey(m.fechaInicioRenta), fin = monthKey(today);
        while(k<=fin){ meses.push(k); var y=Number(k.slice(0,4)), mo=Number(k.slice(5,7))+1; if(mo>12){mo=1;y++;} k = y+'-'+(mo<10?'0'+mo:mo); }
        meses.forEach(function(mes){
          computeMissedDays(m.id, mes).forEach(function(f){
            if(enPeriodo(f)) out.push({ kind:'dia', tipoDia:'nopago', motoId:m.id, fecha:f, placa:m.placa });
          });
        });
      }
    });
    return out;
  }
  function libroConDias(items, dias){
    return items.concat(dias).sort(function(a,b){ return (a.fecha||'').localeCompare(b.fecha||'') || ((a.createdAt||0)-(b.createdAt||0)); });
  }
  function diaPill(it){
    return it.tipoDia==='descanso' ? '<span class="pill dia-rest">Descanso</span>' : '<span class="pill bad">No pagó</span>';
  }

  // ---------- HISTORIAL DE GASTOS ----------
  // Se abre al tocar cualquier valor "Salió" en rojo. Muestra cada gasto con su
  // moto, tipo, descripción y foto, más el total por tipo de gasto y por moto.
  function gastosAttr(cuenta, periodo, moto){
    return ' data-ver-gastos="1" data-g-cuenta="'+escapeHtml(cuenta||'')+'" data-g-periodo="'+(periodo||'mes')+'" data-g-moto="'+escapeHtml(moto||'')+'"';
  }
  function openGastos(cuenta, periodo, motoFiltro){
    cuenta = cuenta||''; periodo = periodo||'mes'; motoFiltro = motoFiltro||'';
    var r = libroItems(cuenta, periodo, motoFiltro);
    var gastos = r.items.filter(function(it){ return it.gasto>0; }).reverse(); // más recientes primero
    var total = gastos.reduce(function(a,it){ return a+it.gasto; },0);
    var motosCuenta = state.motos.filter(function(m){ return cuentaDeMoto(m)===cuenta; });

    var porTipo = {};
    gastos.forEach(function(it){ var k = it.kind==='mant' ? 'Mantenimiento: '+it.tipoMant : it.cat; porTipo[k] = porTipo[k] || {n:0,t:0}; porTipo[k].n++; porTipo[k].t += it.gasto; });
    var tipos = Object.keys(porTipo).sort(function(a,b){ return porTipo[b].t-porTipo[a].t; });
    var porMoto = {};
    gastos.forEach(function(it){ porMoto[it.placa] = (porMoto[it.placa]||0) + it.gasto; });
    var placas = Object.keys(porMoto).sort(function(a,b){ return porMoto[b]-porMoto[a]; });

    var html = '<h2>Historial de gastos</h2>'
      + (cuentasTerceros().length ? '<div class="owner-only-note">Cuenta: <b>'+escapeHtml(nombreCuenta(cuenta))+'</b></div>' : '')
      + '<div class="filtros">'
      + '<select id="gPeriodo" aria-label="Periodo"><option value="mes"'+(periodo==='mes'?' selected':'')+'>'+escapeHtml(new Date(state.viewMonth+'-02').toLocaleDateString('es-CO',{month:'long', year:'numeric'}))+'</option><option value="anio"'+(periodo==='anio'?' selected':'')+'>Todo el año '+state.viewMonth.slice(0,4)+'</option><option value="todo"'+(periodo==='todo'?' selected':'')+'>Desde el principio</option></select>'
      + '<select id="gMoto" aria-label="Moto"><option value="">Todas las motos</option>'
        + motosCuenta.map(function(m){ return '<option value="'+m.id+'"'+(motoFiltro===m.id?' selected':'')+'>'+escapeHtml(m.placa)+'</option>'; }).join('')
        + '<option value="__general"'+(motoFiltro==='__general'?' selected':'')+'>Gastos generales (sin moto)</option></select>'
      + '</div>'
      + '<div class="big-saldo"><div class="label">Total gastado · '+gastos.length+' gasto(s)</div><div class="value neg">'+fmtMoney(total)+'</div></div>';

    if(!gastos.length){
      html += '<div class="empty"><b>No hay gastos</b>en este periodo.</div>';
    } else {
      html += '<div class="section-title">En qué se gastó</div><div class="sheet-wrap"><table class="libro" style="min-width:0;"><thead><tr><th>Tipo de gasto</th><th class="num">Veces</th><th class="num salio">Total</th></tr></thead><tbody>'
        + tipos.map(function(k){ return '<tr><td>'+escapeHtml(k)+'</td><td class="num">'+porTipo[k].n+'</td><td class="num neg">'+fmtMoney(porTipo[k].t)+'</td></tr>'; }).join('')
        + '</tbody></table></div>';
      if(!motoFiltro && placas.length>1){
        html += '<div class="section-title">Por moto</div><div class="sheet-wrap"><table class="libro" style="min-width:0;"><thead><tr><th>Moto</th><th class="num salio">Total</th></tr></thead><tbody>'
          + placas.map(function(pl){ return '<tr><td>'+escapeHtml(pl)+'</td><td class="num neg">'+fmtMoney(porMoto[pl])+'</td></tr>'; }).join('')
          + '</tbody></table></div>';
      }
      html += '<div class="section-title">Cada gasto (del más reciente al más antiguo)</div><div class="list">'
        + gastos.map(function(it){
            var reg = it.createdAt ? new Date(it.createdAt).toLocaleString('es-CO',{timeZone:'America/Bogota',day:'2-digit',month:'short',hour:'numeric',minute:'2-digit'}) : '';
            return '<div class="gasto-item tap" data-g-ficha="'+it.kind+':'+it.id+'" style="cursor:pointer;"><div class="main">'
              + '<div class="t">'+escapeHtml(it.placa)+' · '+escapeHtml(it.kind==='mant'?('Mantenimiento: '+it.tipoMant):it.cat)+'</div>'
              + (it.detalle ? '<div class="d">'+escapeHtml(it.detalle)+'</div>' : '')
              + '<div class="m">'+fmtDate(it.fecha)+' · anotado en '+it.fuente+(reg?(' el '+reg):'')+'</div></div>'
              + '<div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;"><div class="amt">-'+fmtMoney(it.gasto)+'</div>'
              + (it.foto ? '<button class="pill muted" data-g-foto="'+it.kind+':'+it.id+'" style="cursor:pointer;border:none;">Ver recibo</button>' : '')
              + '</div></div>';
          }).join('') + '</div>';
      html += '<div class="owner-only-note" style="margin-top:8px;">Toca un gasto para ver su ficha completa.</div>';
    }
    html += '<div class="sheet-actions" style="margin-top:14px;"><button class="btn ghost" id="cancelSheet">Cerrar</button></div>';

    openSheet(html, function(sheet){
      sheet.querySelector('#cancelSheet').addEventListener('click', closeSheet);
      sheet.querySelector('#gPeriodo').addEventListener('change', function(e){ openGastos(cuenta, e.target.value, motoFiltro); });
      sheet.querySelector('#gMoto').addEventListener('change', function(e){ openGastos(cuenta, periodo, e.target.value); });
      sheet.querySelectorAll('[data-g-ficha]').forEach(function(el){
        el.addEventListener('click', function(){
          var parts = el.getAttribute('data-g-ficha').split(':');
          openGastoDetalle(parts[0], parts[1], function(){ openGastos(cuenta, periodo, motoFiltro); });
        });
      });
      sheet.querySelectorAll('[data-g-foto]').forEach(function(b){
        b.addEventListener('click', function(e){
          e.stopPropagation();
          var parts = b.getAttribute('data-g-foto').split(':');
          var src = parts[0]==='mant' ? state.mantenimientos.find(function(x){return x.id===parts[1];}) : state.movimientos.find(function(x){return x.id===parts[1];});
          if(src && src.fotoUrl) openImageLightbox(src.fotoUrl);
        });
      });
    });
  }

  // Ficha de un gasto: qué fue, de qué moto, cuánto y cuándo. Desde aquí se
  // puede corregir o ver todos los gastos de la misma moto.
  function openGastoDetalle(kind, id, volver){
    var esMant = kind==='mant';
    var src = esMant ? state.mantenimientos.find(function(x){return x.id===id;}) : state.movimientos.find(function(x){return x.id===id;});
    if(!src) return;
    var moto = motoById(src.motoId);
    var placa = moto ? moto.placa : (src.motoPlaca || (src.motoId?'Moto eliminada':'General (sin moto)'));
    var valor = esMant ? Number(src.costo||0) : Number(src.monto||0);
    var tipo = esMant ? ('Mantenimiento: '+(src.tipo||'')) : (src.categoria || (src.tipo==='ingreso'?'Ingreso':'Gasto'));
    var desc = esMant ? (src.notas||'') : (src.nota||'');
    var reg = src.createdAt ? new Date(Number(src.createdAt)).toLocaleString('es-CO',{timeZone:'America/Bogota',day:'2-digit',month:'long',year:'numeric',hour:'numeric',minute:'2-digit'}) : '';
    var esIngreso = !esMant && src.tipo==='ingreso';
    var html = '<h2>'+(esIngreso?'Detalle del ingreso':'Detalle del gasto')+'</h2>'
      + '<div class="big-saldo"><div class="label">'+escapeHtml(tipo)+'</div><div class="value '+(esIngreso?'pos':'neg')+'">'+(esIngreso?'+':'-')+fmtMoney(valor)+'</div></div>'
      + '<div class="stat-list">'
      + statRow('Moto', escapeHtml(placa))
      + statRow('Fecha del '+(esIngreso?'ingreso':'gasto'), fmtDate(src.fecha))
      + (esMant && src.kilometraje ? statRow('Kilometraje', escapeHtml(String(src.kilometraje))+' km') : '')

  function periodoTexto(periodo){
    if(periodo==='todo') return 'todo el tiempo';
    if(periodo==='anio') return 'el año '+state.viewMonth.slice(0,4);
    return new Date(state.viewMonth+'-02').toLocaleDateString('es-CO',{month:'long', year:'numeric'});
  }
  function descargarLibroCSV(cuenta, periodo, motoFiltro){
    var r = libroItems(cuenta, periodo, motoFiltro);
    function q(v){ v = String(v==null?'':v); return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
    var lineas = [['Fecha','Moto','Concepto','Detalle','Entró','Salió','Saldo'].join(';')];
    var _s = 0;
    libroConDias(r.items, libroDias(cuenta, periodo, motoFiltro)).forEach(function(it){
      if(it.kind==='dia'){ lineas.push([it.fecha, it.placa, it.tipoDia==='descanso'?'Día de descanso':'Día sin pago', '', '', '', _s].map(q).join(';')); return; }
      _s = it.saldo; lineas.push([it.fecha, it.placa, it.concepto, it.detalle, it.ingreso||'', it.gasto||'', it.saldo].map(q).join(';'));
    });
    lineas.push(['','','TOTAL','',r.ingresos,r.gastos,r.neto].map(q).join(';'));
    var csv = '﻿' + lineas.join('\r\n');
    var nombre = 'RZ-libro-'+(cuenta?cuenta.replace(/\W+/g,'')+'-':'')+(periodo==='todo'?'completo':periodo==='anio'?state.viewMonth.slice(0,4):state.viewMonth)+(motoFiltro&&motoFiltro!=='__general'?('-'+((motoById(motoFiltro)||{}).placa||'')):'')+'.csv';
    try{
      var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = nombre;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      showToast('Descargado: '+nombre+'. Ábrelo con Excel o Numbers.');
    }catch(e){ showToast('No se pudo descargar en este navegador.', true); }
  }

        + '<div class="lc-total"><span>Entró <span class="pos">'+fmtMoney(r.ingresos)+'</span></span><span>Salió <span class="neg">'+fmtMoney(r.gastos)+'</span></span><span>Quedó '+fmtMoney(r.neto)+'</span></div></div>';

  // ---------- MOTOS ----------
  function estadoPill(estado){
    if(estado==='disponible') return '<span class="pill ok">Disponible</span>';
    if(estado==='rentada') return '<span class="pill warn">Rentada</span>';
    if(estado==='mantenimiento') return '<span class="pill bad">En mantenimiento</span>';
    return '<span class="pill muted">'+escapeHtml(estado||'—')+'</span>';
  }
  function renderMotos(){
    var html = '';
    if(state.motos.length===0){
      html += '<div class="section-title">Inventario (0)</div>';
      html += '<div class="empty"><b>Aún no tienes motos registradas</b>Agrega tu primera moto con el botón +.</div>';
      return html;
    }
    [''].concat(cuentasTerceros()).forEach(function(c){
      var grupo = state.motos.filter(function(m){ return cuentaDeMoto(m)===c; });

      html += '<div class="section-title">'+(c?('Motos de '+escapeHtml(c)+' · cuenta aparte'):'Motos de RZ Rentas')+' ('+grupo.length+')</div>';
      html += '<div class="list" style="margin-bottom:6px;">' + grupo.map(function(m){
        var st = computeMotoStats(m.id);
        var missed = computeMissedDays(m.id, currentMonth);
        return '<div class="row-card tap" data-open-moto="'+m.id+'"><div class="main">'
          + '<div class="title">'+escapeHtml(m.placa||'Sin placa')+(m.marca?(' · '+escapeHtml(m.marca)+(m.modelo?' '+escapeHtml(m.modelo):'')):'')+'</div>'
          + '<div class="meta">'+(m.tarifaDiaria?fmtMoney(m.tarifaDiaria)+'/día · ':'')+(m.kilometraje?Number(m.kilometraje).toLocaleString('es-CO')+' km':'sin km registrado')+'</div>'
          + '<div class="meta2">'+(st.compra?('Compra '+fmtMoney(st.compra)+' · '):'')+'Balance <span style="color:'+(st.balance>=0?'var(--success)':'var(--danger)')+'">'+fmtMoney(st.balance)+'</span>'+(st.recuperado!==null?(' · '+st.recuperado+'% recuperado'):'')+'</div>'
          + (function(){ var dp = depositoMoto(m.id); return (dp.total>0 || m.estado==='rentada') ? '<div class="meta2">Depósito acumulado: <b style="color:var(--accent-strong)">'+fmtMoney(dp.total)+'</b> ('+dp.dias+' día'+(dp.dias===1?'':'s')+' pagado'+(dp.dias===1?'':'s')+')</div>' : ''; })()
          + '</div>'

          + '<button class="del" data-del-moto="'+m.id+'" aria-label="Eliminar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h10l1-13"/></svg></button>'
          + '</div>';
      }).join('') + '</div>';
    });
    return html;
  }

  // ---------- MANTENIMIENTO ----------

  // ---------- GPS ----------
  function renderGps(){
    var html = '<div class="banner"><b>Cómo conectar el GPS real:</b> este panel guarda la zona y el horario autorizados por moto, y lleva el registro de alertas. Para que las alertas de salida de zona y horario inusual lleguen solas necesito los datos de tu rastreador (marca/modelo y su plataforma o API — por ejemplo Concox, Coban, Jimi IoT, Whatsgps). Mientras tanto, registra aquí manualmente lo que te avise la app del rastreador.</div>';

    if(state.motos.length===0){
      html += '<div class="empty"><b>Primero registra una moto</b>Ve a la pestaña Motos para agregar tu inventario.</div>';
      return html;
    }

    html += '<div class="section-title">Reglas por moto</div>';
    html += state.motos.map(function(m){
      return '<div class="gps-block">'
        + '<div class="h"><div class="title">'+escapeHtml(m.placa)+(m.marca?(' · '+escapeHtml(m.marca)):'')+'</div>'
        + '<button class="pill muted" data-editrules="'+m.id+'" style="cursor:pointer;border:none;">Editar</button></div>'
        + '<div class="gps-mini">'
        + '<div>Zona autorizada<b>'+escapeHtml(m.zona||'Sin definir')+'</b></div>'
        + '<div>Horario permitido<b>'+(m.horaInicio&&m.horaFin ? (m.horaInicio+' – '+m.horaFin) : 'Sin definir')+'</b></div>'
        + '</div></div>';
    }).join('');

    var alertas = state.alertas.slice().sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'');});
    html += '<div class="section-title">Registro de alertas</div>';
    if(alertas.length===0){
      html += '<div class="empty">Sin alertas registradas. Usa el botón + para anotar una salida de zona u horario inusual.</div>';

  // Campo reutilizable de "foto del recibo" para los formularios de gasto y
  // mantenimiento: muestra la miniatura si ya hay una, permite reemplazarla o
  // quitarla, y comprime cualquier foto nueva antes de guardarla.
  function renderPhotoField(id, existingUrl){
    return '<div class="field"><label>Foto del recibo o factura (opcional)</label>'
      + '<input type="file" accept="image/*" capture="environment" id="'+id+'Input">'
      + '<div class="field-error" id="'+id+'Err" hidden></div>'
      + '<div id="'+id+'Preview">'+(existingUrl?photoPreviewHtml(id,existingUrl):'')+'</div>'
      + '</div>';
  }
  function photoPreviewHtml(id, url){
    return '<div class="photo-preview"><img src="'+url+'" alt="Foto del recibo"><button type="button" class="btn ghost" id="'+id+'Remove">Quitar foto</button></div>';
  }
  function wirePhotoField(sheet, id, initialUrl){
    var current = initialUrl || null;
    var input = sheet.querySelector('#'+id+'Input');
    var err = sheet.querySelector('#'+id+'Err');
    var preview = sheet.querySelector('#'+id+'Preview');
    function renderPreview(){
      preview.innerHTML = current ? photoPreviewHtml(id, current) : '';
      var rmBtn = preview.querySelector('#'+id+'Remove');
      if(rmBtn) rmBtn.addEventListener('click', function(){ current=null; input.value=''; renderPreview(); });
    }
    renderPreview();
    input.addEventListener('change', function(){
      var file = input.files && input.files[0];
      if(!file) return;
      err.hidden = true;
      compressImageToDataURL(file, 150000, function(url, error){
        if(error){ err.textContent = error; err.hidden = false; return; }
        current = url; renderPreview();
      });
    });
    return { get: function(){ return current; } };
  }

    // cuenta, así que no hay forma de cargarle algo a la otra por error.

      + '<div class="field" style="margin-top:12px"><label>Monto (COP)</label><input type="text" inputmode="numeric" id="fMonto" placeholder="0" value="'+(existing?existing.monto:'')+'"><div class="field-error" id="fMontoErr" hidden>Ingresa un monto mayor a cero.</div></div>'
      + '<div class="field"><label>Categoría</label><select id="fCategoria"></select><div class="hint" id="fCatHint" hidden></div></div>'
      + '<div class="field"><label>Moto (opcional)</label><select id="fMoto">'+motoOpts+'</select>'
      + (cuentasTerceros().length && !existing ? '<div class="owner-only-note" style="margin:4px 0 0;">Para registrar en la otra cuenta, cierra esto y cámbiala arriba en Finanzas.</div>' : '')
      + '</div>'
      + '<div class="field"><label>Fecha</label><input type="date" id="fFecha" value="'+(existing?existing.fecha:todayISO())+'"><div class="hint" id="fFechaHint" hidden></div></div>'

      + renderPhotoField('fFoto', existing?existing.fotoUrl:null)

      function(sheet){
        var photoField = wirePhotoField(sheet, 'fFoto', existing?existing.fotoUrl:null);
        function catOpts(){
          var cats = tipo==='ingreso' ? ['Renta','Depósito','Otro ingreso'] : ['Mantenimiento','Combustible','Seguros (SOAT/todo riesgo)','Repuestos','Administrativo','Otro gasto'];
          document.getElementById('fCategoria').innerHTML = cats.map(function(c){return '<option'+(existing&&existing.categoria===c?' selected':'')+'>'+c+'</option>';}).join('');
          catHint();
        }
        function catHint(){
          var c = document.getElementById('fCategoria').value, h = document.getElementById('fCatHint');
          var msg = '';
          if(tipo==='gasto' && (c==='Mantenimiento' || c==='Repuestos')) msg = 'Si ya lo anotaste en la pestaña Mantenimiento, no lo registres aquí: se descontaría dos veces.';
          else if(tipo==='gasto' && c==='Administrativo') msg = 'Si es el pago de nómina, no lo registres: ya se apartaron '+fmtMoney(ADMIN_DIARIO)+' de cada renta.';
          h.textContent = msg; h.hidden = !msg;
        }
        document.getElementById('fCategoria').addEventListener('change', catHint);
        function fechaHint(){
          var f = document.getElementById('fFecha').value, h = document.getElementById('fFechaHint'), hoy = todayISO();
          var msg = '';
          if(f && f>hoy) msg = 'Esta fecha es futura. El movimiento contará en el mes de esa fecha, no en el de hoy.';
          else if(f && monthKey(f)!==monthKey(hoy)) msg = 'Este movimiento contará en '+new Date(f+'T12:00:00').toLocaleDateString('es-CO',{month:'long',year:'numeric'})+', no en el mes actual.';
          h.textContent = msg; h.hidden = !msg;

        catOpts();
        sheet.querySelectorAll('#segTipo button').forEach(function(btn){

          });

        sheet.querySelector('#saveMov').addEventListener('click', function(){
          var monto = parseMoney(document.getElementById('fMonto').value);
          if(!monto || monto<=0){
            document.getElementById('fMonto').focus();
            document.getElementById('fMontoErr').hidden = false;
            return;
          }
          document.getElementById('fMontoErr').hidden = true;
          var motoId = document.getElementById('fMoto').value;
          var moto = motoId ? motoById(motoId) : null;

            var dupMant = data.tipo==='gasto' && data.motoId && state.mantenimientos.find(function(mt){
              return mt.motoId===data.motoId && Number(mt.costo||0)===data.monto && monthKey(mt.fecha)===monthKey(data.fecha);

                'Guardar de todos modos', guardarMov);

          }

    );
  }

  // Al terminar una renta: muestra el depósito acumulado, pregunta cuánto se
  // devuelve y deja todo anotado. Lo retenido entra como ingreso de la moto.
  function openLiquidarDeposito(moto, motoData, dep){
    var arr = moto.arrendatarioNombre || 'el arrendatario';
    openSheet(
      '<h2>Liquidar depósito</h2>'
      + '<div class="owner-only-note">'+escapeHtml(moto.placa)+' pasa a Disponible. Antes, define cuánto del depósito se le devuelve a '+escapeHtml(arr)+'.</div>'
      + '<div class="stat-list">'
      + statRow('Días pagados en esta renta', dep.dias+' día(s)')
      + statRowTotal('Depósito acumulado', fmtMoney(dep.total), 'pos')
      + '</div>'
      + '<div class="field"><label for="ldDevuelve">Valor que se devuelve (COP)</label><input id="ldDevuelve" type="text" inputmode="numeric" value="'+dep.total+'"></div>'
      + '<div class="field" id="ldMotivoWrap" hidden><label for="ldMotivo">¿Por qué se retiene una parte?</label><input id="ldMotivo" placeholder="Ej. daño en el espejo, días sin pagar"></div>'
      + '<div class="hint" id="ldResumen"></div>'
      + '<div class="field-error" id="ldErr" hidden></div>'
      + '<div class="sheet-actions" style="margin-top:12px;"><button class="btn ghost" id="cancelSheet">Volver</button><button class="btn primary" id="ldSave">Liquidar y liberar moto</button></div>',
      function(sheet){
        var inp = sheet.querySelector('#ldDevuelve');
        function upd(){
          var dev = parseMoney(inp.value);
          var ret = dep.total - dev;
          var res = sheet.querySelector('#ldResumen');
          sheet.querySelector('#ldMotivoWrap').hidden = !(ret>0);
          if(dev>dep.total){ res.textContent = 'No puedes devolver más de lo acumulado ('+fmtMoney(dep.total)+').'; return; }
          res.textContent = ret>0
            ? 'Se devuelven '+fmtMoney(dev)+' y se retienen '+fmtMoney(ret)+'. Lo retenido entra como ingreso de esta moto.'
            : 'Se devuelve todo el depósito ('+fmtMoney(dev)+'). No cambia tu saldo.';
        }
        inp.addEventListener('input', upd); upd();
        sheet.querySelector('#cancelSheet').addEventListener('click', function(){ openMotoForm(moto); });
        sheet.querySelector('#ldSave').addEventListener('click', function(){
          var err = sheet.querySelector('#ldErr');
          var dev = parseMoney(inp.value);
          if(inp.value.trim()==='') dev = 0;
          if(dev>dep.total){ err.textContent='El valor a devolver no puede ser mayor que '+fmtMoney(dep.total)+'.'; err.hidden=false; return; }
          var ret = dep.total - dev;
          var motivo = (sheet.querySelector('#ldMotivo').value||'').trim();
          if(ret>0 && !motivo){ err.textContent='Escribe por qué se retiene una parte, para que quede anotado.'; err.hidden=false; return; }
          var now = Date.now(), hoy = todayISO();
          var batch = db.batch();
          batch.update(db.doc(negocioPath('motos')+'/'+moto.id), Object.assign({}, motoData, { depositoCorte: now }));
          batch.set(db.collection(negocioPath('movimientos')).doc(), {
            tipo:'deposito_liq', motoId:moto.id, motoPlaca:moto.placa, fecha:hoy, createdAt:now, cuenta: cuentaDeMoto(moto),
            monto: dev, retenido: ret, acumulado: dep.total, dias: dep.dias,
            arrendatarioNombre: moto.arrendatarioNombre||'', categoria:'Liquidación de depósito', nota: motivo
          });
          if(ret>0){
            batch.set(db.collection(negocioPath('movimientos')).doc(), {
              tipo:'ingreso', motoId:moto.id, motoPlaca:moto.placa, fecha:hoy, createdAt:now, cuenta: cuentaDeMoto(moto),
              monto: ret, categoria:'Depósito retenido', nota: motivo+(moto.arrendatarioNombre?(' · '+moto.arrendatarioNombre):''), fotoUrl:null
            });
          }
          var btn = sheet.querySelector('#ldSave'); btn.disabled = true;
          batch.commit().then(function(){
            closeSheet();
            showToast(ret>0 ? ('Depósito liquidado: se devuelven '+fmtMoney(dev)+', se retienen '+fmtMoney(ret)+'.') : ('Depósito liquidado: se devuelven '+fmtMoney(dev)+'.'));
          }).catch(function(e){ btn.disabled=false; showSaveError(e); });
        });
      }
    );
  }

  // Para rentas que empezaron antes de existir el depósito: pasa al depósito
  // los $5.000 de esos días. Como esos días ya se contaron como ingreso, se
  // registra un gasto "Traslado a depósito" por el mismo valor para no inflar el saldo.
  function openAjusteDeposito(m){
    var dias = diasSinDeposito(m);
    if(!dias.length) return;
    var monto = dias.length * DEPOSITO_DIARIO;
    askConfirm('Pasar días anteriores al depósito',
      escapeHtml(m.placa)+' tiene <b>'+dias.length+' día(s) pagados</b> en esta renta que se registraron antes del depósito. '
      + 'Se pasan <b>'+fmtMoney(monto)+'</b> al depósito ('+fmtMoney(DEPOSITO_DIARIO)+' por día).<br><br>'
      + 'Como esos días ya se contaron como ingreso, se anota un gasto "Traslado a depósito" de '+fmtMoney(monto)+' con fecha de hoy, para que tu saldo no cuente esa plata dos veces.',
      'Pasar al depósito', function(){
        var now = Date.now(), hoy = todayISO();
        var batch = db.batch();
        dias.forEach(function(r){
          batch.set(db.collection(negocioPath('movimientos')).doc(), { tipo:'deposito', motoId:m.id, motoPlaca:m.placa, fecha:r.fecha, createdAt:r.createdAt, cuenta: cuentaDeMoto(m),
            monto: DEPOSITO_DIARIO, categoria:'Depósito reembolsable', nota:'Pasado al depósito después (renta registrada antes del cambio)' });
        });
        batch.set(db.collection(negocioPath('movimientos')).doc(), { tipo:'gasto', motoId:m.id, motoPlaca:m.placa, fecha:hoy, createdAt:now, cuenta: cuentaDeMoto(m),
          monto: monto, categoria:'Traslado a depósito', nota: dias.length+' día(s) de la renta actual pasados al depósito reembolsable', fotoUrl:null });
        batch.commit().then(function(){ showToast(fmtMoney(monto)+' pasados al depósito de '+m.placa+'.'); setTimeout(function(){ openMotoDetail(m.id, true); }, 350); }).catch(showSaveError);
      }, function(){ openMotoDetail(m.id, true); });
  }

          + '<div class="amount '+(mv.tipo==='ingreso'?'pos':'neg')+'">'+(mv.tipo==='ingreso'?'+':'-')+fmtMoney(mv.monto)+'</div>'

  // Conecta los botones del calendario. Al cambiar de mes solo se redibuja el
  // calendario (no toda la hoja), así no se pierde la posición en pantalla.
  function wireCalendar(sheet, m){
    var wrap = sheet.querySelector('#calWrap'); if(!wrap) return;
    wrap.querySelectorAll('[data-cal-month]').forEach(function(b){
      b.addEventListener('click', function(){
        var next = shiftMonth(calMonth||currentMonth, Number(b.getAttribute('data-cal-month')));
        if(next>currentMonth) return;
        calMonth = next;
        wrap.innerHTML = renderMotoCalendar(m.id);
        wireCalendar(sheet, m);
      });
    });
    wrap.querySelectorAll('[data-cal-dia]').forEach(function(cell){
      cell.addEventListener('click', function(){
        var iso = cell.getAttribute('data-cal-dia');
        var mm = motoById(m.id) || m;
        var yaDescanso = esDescanso(mm, iso);
        var hoy = todayISO();
        var fest = nombreFestivo(iso);
        var yaPagado = state.movimientos.some(function(mv){ return mv.motoId===mm.id && mv.tipo==='ingreso' && mv.categoria==='Renta' && mv.fecha===iso; });
        var esAdminMoto = !!cuentaDeMoto(mm);
        var volver = function(){ openMotoDetail(m.id, true); };
        openSheet(
          '<h2>'+escapeHtml(mm.placa)+' · '+fmtDate(iso)+'</h2>'
          + (fest ? '<div class="warn-box" style="border-color:#a78bfa;"><b>Día festivo · '+escapeHtml(fest)+'</b>La renta de hoy vale '+fmtMoney(TARIFA_FESTIVO)
              + (esAdminMoto ? ' y va completa a la cuenta de '+escapeHtml(cuentaDeMoto(mm))+'.' : ': '+fmtMoney(TARIFA_FESTIVO-ADMIN_FESTIVO)+' para RZ y '+fmtMoney(ADMIN_FESTIVO)+' para el administrador.')
              + ' No se aparta depósito.</div>' : '')
          + (yaPagado ? '<div class="owner-only-note">Este día ya tiene la renta registrada.</div>' : '<div class="owner-only-note">'+(yaDescanso
              ? 'Este día está marcado como <b>descanso del conductor</b>: no cuenta como día sin pago.'
              : (iso<=hoy ? 'Este día no tiene pago registrado. ¿Qué pasó?' : 'Puedes dejar marcado desde ya un día de descanso.'))+'</div>')
          + '<div style="display:flex; flex-direction:column; gap:10px; margin-top:10px;">'
          + (yaPagado ? '' : yaDescanso
              ? '<button class="btn primary" id="dQuitar">Quitar descanso</button>'
              : (iso<=hoy ? '<button class="btn primary" id="dPagar">Registrar pago de '+fmtMoney(tarifaDelDia(mm, iso))+(fest?' (festivo)':'')+'</button>' : '')
                + '<button class="btn '+(iso<=hoy?'ghost':'primary')+'" id="dMarcar">Fue día de descanso</button>')
          + (fest ? '<button class="btn ghost" id="dNoFest">Este día NO es festivo</button>' : '<button class="btn ghost" id="dSiFest">Marcar como día festivo</button>')
          + '<button class="btn ghost" id="dVolver">Volver</button></div>',
          function(sheet){
            sheet.querySelector('#dVolver').addEventListener('click', volver);
            var bsf = sheet.querySelector('#dSiFest');
            if(bsf) bsf.addEventListener('click', function(){ marcarFestivo(iso, true, function(){ showToast(fmtDate(iso)+' marcado como festivo.'); volver(); }); });
            var bnf = sheet.querySelector('#dNoFest');
            if(bnf) bnf.addEventListener('click', function(){ marcarFestivo(iso, false, function(){ showToast(fmtDate(iso)+' ya no cuenta como festivo.'); volver(); }); });
            var bm = sheet.querySelector('#dMarcar');
            if(bm) bm.addEventListener('click', function(){
              guardarDescanso(mm, iso, true, function(){ showToast(fmtDate(iso)+' marcado como descanso.'); volver(); });
            });
            var bq = sheet.querySelector('#dQuitar');
            if(bq) bq.addEventListener('click', function(){
              guardarDescanso(mm, iso, false, function(){ showToast('Se quitó el descanso del '+fmtDate(iso)+'.'); volver(); });
            });
            var bp = sheet.querySelector('#dPagar');
            if(bp) bp.addEventListener('click', function(){
              registrarPagoRenta(mm, iso, 'Pago atrasado registrado desde el calendario', function(){
                showToast('Pago del '+fmtDate(iso)+' registrado'+(fest?(' como festivo ('+fmtMoney(TARIFA_FESTIVO)+', sin depósito)'):'')+'.'); setTimeout(volver, 350);
              });
            });
          }
        );
      });
    });
    wrap.querySelectorAll('[data-cal-info]').forEach(function(cell){
      cell.addEventListener('click', function(){
        var row = wrap.querySelector('#pago-'+cell.getAttribute('data-cal-info'));
        if(row){
          row.scrollIntoView({behavior:'smooth', block:'center'});
          row.style.boxShadow = '0 0 0 2px var(--success) inset';
          setTimeout(function(){ row.style.boxShadow=''; }, 1600);
        }
      });
    });
  }
