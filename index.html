  // Campo reutilizable de "foto del recibo" para los formularios de gasto y
  // mantenimiento: muestra la miniatura si ya hay una, permite reemplazarla o
  // quitarla, y comprime cualquier foto nueva antes de guardarla.
  function renderPhotoField(id, existingUrl){
    return '<div class="field"><label>Foto del recibo o factura (opcional)</label>'
      + '<input type="file" accept="image/*" capture="environment" id="'+id+'Input">'
      + '<div class="field-error" id="'+id+'Err" hidden></div>'
      + '<div id="'+id+'Preview">'+(existingUrl?photoPreviewHtml(id,existingUrl):'')+'</div>'
      + '</div>';
  }
  function photoPreviewHtml(id, url){
    return '<div class="photo-preview"><img src="'+url+'" alt="Foto del recibo"><button type="button" class="btn ghost" id="'+id+'Remove">Quitar foto</button></div>';
  }
  function wirePhotoField(sheet, id, initialUrl){
    var current = initialUrl || null;
    var input = sheet.querySelector('#'+id+'Input');
    var err = sheet.querySelector('#'+id+'Err');
    var preview = sheet.querySelector('#'+id+'Preview');
    function renderPreview(){
      preview.innerHTML = current ? photoPreviewHtml(id, current) : '';
      var rmBtn = preview.querySelector('#'+id+'Remove');
      if(rmBtn) rmBtn.addEventListener('click', function(){ current=null; input.value=''; renderPreview(); });
    }
    renderPreview();
    input.addEventListener('change', function(){
      var file = input.files && input.files[0];
      if(!file) return;
      err.hidden = true;
      compressImageToDataURL(file, 150000, function(url, error){
        if(error){ err.textContent = error; err.hidden = false; return; }
        current = url; renderPreview();
      });
    });
    return { get: function(){ return current; } };
  }

  function openImageLightbox(url){
    if(!url) return;
    openSheet(
      '<h2>Foto del recibo</h2>'
      + '<img src="'+url+'" style="width:100%; border-radius:10px; display:block;" alt="Foto del recibo">'
      + '<div class="sheet-actions" style="margin-top:14px;"><button class="btn ghost" id="cancelSheet">Cerrar</button></div>',
      function(sheet){ sheet.querySelector('#cancelSheet').addEventListener('click', closeSheet); }
    );
  }

  function openSheet(innerHtml, onMount){
    closeSheet();
    var back = document.createElement('div');
    back.className='sheet-backdrop'; back.id='sheetBackdrop';
    back.addEventListener('click', function(e){ if(e.target===back) closeSheet(); });
    var sheet = document.createElement('div');
    sheet.className='sheet';
    sheet.innerHTML = innerHtml;
    back.appendChild(sheet);
    document.body.appendChild(back);
    if(onMount) onMount(sheet);
  }
  function closeSheet(){
    var b = document.getElementById('sheetBackdrop');
    if(b) b.remove();
  }

  function openMovForm(existing){
    var tipo = existing ? existing.tipo : 'gasto';
    // El formulario queda amarrado a UNA cuenta: la del movimiento que se edita,
    // o la que está seleccionada arriba en Finanzas. Solo aparecen motos de esa
    // cuenta, así que no hay forma de cargarle algo a la otra por error.
    var cuentaForm = existing ? cuentaDeMov(existing) : (state.cuenta || '');
    var motoOpts = '<option value="">Sin moto (gasto general de '+escapeHtml(nombreCuenta(cuentaForm))+')</option>' + motoOptionsHtml(existing?existing.motoId:null, cuentaForm);
    openSheet(
      '<h2>'+(existing?'Editar movimiento':'Nuevo movimiento')+'</h2>'
      + cuentaBanner(cuentaForm)
      + '<div class="seg" id="segTipo"><button type="button" class="'+(tipo==='gasto'?'active':'')+'" data-v="gasto">Gasto</button><button type="button" class="'+(tipo==='ingreso'?'active':'')+'" data-v="ingreso">Ingreso</button></div>'
      + '<div class="field" style="margin-top:12px"><label>Monto (COP)</label><input type="text" inputmode="numeric" id="fMonto" placeholder="0" value="'+(existing?existing.monto:'')+'"><div class="field-error" id="fMontoErr" hidden>Ingresa un monto mayor a cero.</div></div>'
      + '<div class="field"><label>Categoría</label><select id="fCategoria"></select><div class="hint" id="fCatHint" hidden></div></div>'
      + '<div class="field"><label>Moto (opcional)</label><select id="fMoto">'+motoOpts+'</select>'
      + (cuentasTerceros().length && !existing ? '<div class="owner-only-note" style="margin:4px 0 0;">Para registrar en la otra cuenta, cierra esto y cámbiala arriba en Finanzas.</div>' : '')
      + '</div>'
      + '<div class="field"><label>Fecha</label><input type="date" id="fFecha" value="'+(existing?existing.fecha:todayISO())+'"><div class="hint" id="fFechaHint" hidden></div></div>'
      + '<div class="field"><label>Nota (opcional)</label><textarea id="fNota" placeholder="Detalle breve">'+(existing?escapeHtml(existing.nota||''):'')+'</textarea></div>'
      + renderPhotoField('fFoto', existing?existing.fotoUrl:null)
      + '<div class="sheet-actions"><button class="btn ghost" id="cancelSheet">Cancelar</button><button class="btn primary" id="saveMov">Guardar</button></div>',
      function(sheet){
        var photoField = wirePhotoField(sheet, 'fFoto', existing?existing.fotoUrl:null);
        function catOpts(){
          var cats = tipo==='ingreso' ? ['Renta','Depósito','Otro ingreso'] : ['Mantenimiento','Combustible','Seguros (SOAT/todo riesgo)','Repuestos','Administrativo','Otro gasto'];
          document.getElementById('fCategoria').innerHTML = cats.map(function(c){return '<option'+(existing&&existing.categoria===c?' selected':'')+'>'+c+'</option>';}).join('');
          catHint();
        }
        function catHint(){
          var c = document.getElementById('fCategoria').value, h = document.getElementById('fCatHint');
          var msg = '';
          if(tipo==='gasto' && (c==='Mantenimiento' || c==='Repuestos')) msg = 'Si ya lo anotaste en la pestaña Mantenimiento, no lo registres aquí: se descontaría dos veces.';
          else if(tipo==='gasto' && c==='Administrativo') msg = 'Si es el pago de nómina, no lo registres: ya se apartaron '+fmtMoney(ADMIN_DIARIO)+' de cada renta.';
          h.textContent = msg; h.hidden = !msg;
        }
        document.getElementById('fCategoria').addEventListener('change', catHint);
        function fechaHint(){
          var f = document.getElementById('fFecha').value, h = document.getElementById('fFechaHint'), hoy = todayISO();
          var msg = '';
          if(f && f>hoy) msg = 'Esta fecha es futura. El movimiento contará en el mes de esa fecha, no en el de hoy.';
          else if(f && monthKey(f)!==monthKey(hoy)) msg = 'Este movimiento contará en '+new Date(f+'T12:00:00').toLocaleDateString('es-CO',{month:'long',year:'numeric'})+', no en el mes actual.';
          h.textContent = msg; h.hidden = !msg;
        }
        document.getElementById('fFecha').addEventListener('input', fechaHint);
        fechaHint();
        catOpts();
        sheet.querySelectorAll('#segTipo button').forEach(function(btn){
          btn.addEventListener('click', function(){
            sheet.querySelectorAll('#segTipo button').forEach(function(x){x.classList.remove('active');});
            btn.classList.add('active'); tipo = btn.getAttribute('data-v'); catOpts();
          });
        });
        sheet.querySelector('#cancelSheet').addEventListener('click', closeSheet);
        sheet.querySelector('#saveMov').addEventListener('click', function(){
          var monto = parseMoney(document.getElementById('fMonto').value);
          if(!monto || monto<=0){
            document.getElementById('fMonto').focus();
            document.getElementById('fMontoErr').hidden = false;
            return;
          }
          document.getElementById('fMontoErr').hidden = true;
          var motoId = document.getElementById('fMoto').value;
          var moto = motoId ? motoById(motoId) : null;
          if(moto && cuentaDeMoto(moto)!==cuentaForm){ showToast('Esa moto es de otra cuenta. No se guardó nada.', true); return; }
          var data = {
            tipo: tipo, monto: monto, categoria: document.getElementById('fCategoria').value,
            motoId: motoId||null, motoPlaca: moto?moto.placa:null,
            fecha: document.getElementById('fFecha').value||todayISO(),
            nota: document.getElementById('fNota').value||'',
            fotoUrl: photoField.get()||null,
            cuenta: cuentaForm
          };
          if(existing){
            db.doc(negocioPath('movimientos')+'/'+existing.id).update(data).then(closeSheet).catch(showSaveError);
          } else {
            data.createdAt = Date.now();
            var guardarMov = function(){ db.collection(negocioPath('movimientos')).add(data).then(closeSheet).catch(showSaveError); };
            var dupMant = data.tipo==='gasto' && data.motoId && state.mantenimientos.find(function(mt){
              return mt.motoId===data.motoId && Number(mt.costo||0)===data.monto && monthKey(mt.fecha)===monthKey(data.fecha);
            });
            if(dupMant){
              askConfirm('¿Ya está registrado?',
                'En Mantenimiento ya hay "'+escapeHtml(dupMant.tipo)+'" de <b>'+fmtMoney(dupMant.costo)+'</b> para '+escapeHtml(data.motoPlaca||'')+' ('+fmtDate(dupMant.fecha)+'). Si es el mismo gasto, guardarlo aquí lo descontaría dos veces.',
                'Guardar de todos modos', guardarMov);
            } else guardarMov();
          }
        });
      }
    );
  }

      + '<div class="field"><label>Año</label><input id="mAnio" type="number" placeholder="2024" value="'+escapeHtml(m.anio||'')+'"></div></div>'
      + '<div class="two-col"><div class="field"><label>Marca</label><input id="mMarca" placeholder="AKT, Yamaha..." value="'+escapeHtml(m.marca||'')+'"></div>'
      + '<div class="field"><label>Modelo</label><input id="mModelo" placeholder="NKD 125" value="'+escapeHtml(m.modelo||'')+'"></div></div>'
      + '<div class="field"><label>Valor de compra (COP)</label><input id="mCompra" type="text" inputmode="numeric" placeholder="7500000" value="'+(m.valorCompra||'')+'"></div>'
      + '<div class="two-col"><div class="field"><label>Tarifa diaria de renta (COP)</label><input id="mTarifa" type="text" inputmode="numeric" placeholder="60000" value="'+(m.tarifaDiaria||'')+'"></div>'
      + '<div class="field"><label>Kilometraje</label><input id="mKm" type="number" placeholder="0" value="'+(m.kilometraje||'')+'"></div></div>'
      + (function(){
          var actual = cuentaDeMoto(m);

            return '<div class="field"><label>¿De quién es la moto?</label>'
              + '<input value="'+escapeHtml(nombreCuenta(actual))+(actual?' (cuenta aparte)':'')+'" disabled>'
              + '<input type="hidden" id="mProp" value="'+escapeHtml(actual)+'"><input id="mPropOtro" hidden>'
              + '<div class="owner-only-note" style="margin:4px 0 0;">Bloqueado: esta moto ya tiene pagos o gastos registrados. Cambiarle el propietario movería toda su historia a la otra cuenta. Si de verdad cambió de dueño, regístrala como una moto nueva.</div><div id="mPropHint" hidden></div></div>';
          }
          var ops = [''].concat(cuentasTerceros());
          if(ops.indexOf('Administrador')<0) ops.push('Administrador');

          return '<div class="field"><label for="mProp">¿De quién es la moto?</label><select id="mProp">'

            + '<option value="__otro">Otro propietario…</option></select>'

            + '<div class="hint" id="mPropHint"'+(actual?'':' hidden')+'>Cuenta aparte: sus pagos, gastos y depósito no se suman a RZ Rentas, y no se aparta nómina.</div></div>';
        })()
      + '<div class="field"><label>Estado</label><select id="mEstado">'+opts+'</select></div>'
      + '<div class="field"><label>Fecha de inicio de renta actual (opcional)</label><input id="mInicioRenta" type="date" value="'+(m.fechaInicioRenta||'')+'"></div>'
      + '<div class="owner-only-note" style="margin-top:-6px;">Si la marcas "Rentada" y defines esta fecha, el calendario de esa moto marca en rojo cada día sin pago desde entonces.</div>'
      + '<div class="section-title" style="margin-top:8px;">Datos de quien la tiene rentada</div>'
      + '<div class="field"><label>Nombre completo</label><input id="mArrNombre" placeholder="Nombre del arrendatario" value="'+escapeHtml(m.arrendatarioNombre||'')+'"></div>'
      + '<div class="two-col"><div class="field"><label>N° de documento</label><input id="mArrDoc" placeholder="C.C. 1234567890" value="'+escapeHtml(m.arrendatarioDocumento||'')+'"></div>'
      + '<div class="field"><label>Teléfono (WhatsApp)</label><input id="mArrTel" type="tel" placeholder="3001234567" value="'+escapeHtml(m.arrendatarioTelefono||'')+'"></div></div>'
      + '<div class="sheet-actions"><button class="btn ghost" id="cancelSheet">Cancelar</button><button class="btn primary" id="saveMoto">Guardar</button></div>',
      function(sheet){

        var propSel = sheet.querySelector('#mProp');
        propSel.addEventListener('change', function(){
          sheet.querySelector('#mPropOtro').hidden = propSel.value!=='__otro';

        sheet.querySelector('#saveMoto').addEventListener('click', function(){
          var placa = document.getElementById('mPlaca').value.trim().toUpperCase();
          var propietario = propSel.value==='__otro' ? sheet.querySelector('#mPropOtro').value.trim() : propSel.value;
          if(propSel.value==='__otro' && !propietario){ sheet.querySelector('#mPropOtro').focus(); return; }

            inicioRenta = todayISO(); // conveniencia: si recién se marca como rentada, arranca el calendario hoy
          }
          if(nuevoEstado!=='rentada') inicioRenta = null;
          var data = {
            placa: placa, anio: document.getElementById('mAnio').value||null,
            marca: document.getElementById('mMarca').value||'', modelo: document.getElementById('mModelo').value||'',
            valorCompra: parseMoney(document.getElementById('mCompra').value),
            tarifaDiaria: parseMoney(document.getElementById('mTarifa').value),
            kilometraje: Number(document.getElementById('mKm').value)||0,
            estado: nuevoEstado, fechaInicioRenta: inicioRenta, propietario: propietario || '',
            arrendatarioNombre: document.getElementById('mArrNombre').value||'',
            arrendatarioDocumento: document.getElementById('mArrDoc').value||'',
            arrendatarioTelefono: document.getElementById('mArrTel').value||''
          };
          if(existing){
            var dep = depositoMoto(existing.id);
            if(existing.estado==='rentada' && nuevoEstado==='disponible' && dep.total>0){
              openLiquidarDeposito(existing, data, dep);
              return;
            }
            if(existing.estado==='rentada' && nuevoEstado==='disponible') data.depositoCorte = Date.now();
            db.doc(negocioPath('motos')+'/'+existing.id).update(data).then(closeSheet).catch(showSaveError);
          } else {
            data.createdAt = Date.now();
            db.collection(negocioPath('motos')).add(data).then(closeSheet).catch(showSaveError);
          }
        });
      }
    );
  }

  // Al terminar una renta: muestra el depósito acumulado, pregunta cuánto se
  // devuelve y deja todo anotado. Lo retenido entra como ingreso de la moto.
  function openLiquidarDeposito(moto, motoData, dep){
    var arr = moto.arrendatarioNombre || 'el arrendatario';
    openSheet(
      '<h2>Liquidar depósito</h2>'
      + '<div class="owner-only-note">'+escapeHtml(moto.placa)+' pasa a Disponible. Antes, define cuánto del depósito se le devuelve a '+escapeHtml(arr)+'.</div>'
      + '<div class="stat-list">'
      + statRow('Días pagados en esta renta', dep.dias+' día(s)')
      + statRowTotal('Depósito acumulado', fmtMoney(dep.total), 'pos')
      + '</div>'
      + '<div class="field"><label for="ldDevuelve">Valor que se devuelve (COP)</label><input id="ldDevuelve" type="text" inputmode="numeric" value="'+dep.total+'"></div>'
      + '<div class="field" id="ldMotivoWrap" hidden><label for="ldMotivo">¿Por qué se retiene una parte?</label><input id="ldMotivo" placeholder="Ej. daño en el espejo, días sin pagar"></div>'
      + '<div class="hint" id="ldResumen"></div>'
      + '<div class="field-error" id="ldErr" hidden></div>'
      + '<div class="sheet-actions" style="margin-top:12px;"><button class="btn ghost" id="cancelSheet">Volver</button><button class="btn primary" id="ldSave">Liquidar y liberar moto</button></div>',
      function(sheet){
        var inp = sheet.querySelector('#ldDevuelve');
        function upd(){
          var dev = parseMoney(inp.value);
          var ret = dep.total - dev;
          var res = sheet.querySelector('#ldResumen');
          sheet.querySelector('#ldMotivoWrap').hidden = !(ret>0);
          if(dev>dep.total){ res.textContent = 'No puedes devolver más de lo acumulado ('+fmtMoney(dep.total)+').'; return; }
          res.textContent = ret>0
            ? 'Se devuelven '+fmtMoney(dev)+' y se retienen '+fmtMoney(ret)+'. Lo retenido entra como ingreso de esta moto.'
            : 'Se devuelve todo el depósito ('+fmtMoney(dev)+'). No cambia tu saldo.';
        }
        inp.addEventListener('input', upd); upd();
        sheet.querySelector('#cancelSheet').addEventListener('click', function(){ openMotoForm(moto); });
        sheet.querySelector('#ldSave').addEventListener('click', function(){
          var err = sheet.querySelector('#ldErr');
          var dev = parseMoney(inp.value);
          if(inp.value.trim()==='') dev = 0;
          if(dev>dep.total){ err.textContent='El valor a devolver no puede ser mayor que '+fmtMoney(dep.total)+'.'; err.hidden=false; return; }
          var ret = dep.total - dev;
          var motivo = (sheet.querySelector('#ldMotivo').value||'').trim();
          if(ret>0 && !motivo){ err.textContent='Escribe por qué se retiene una parte, para que quede anotado.'; err.hidden=false; return; }
          var now = Date.now(), hoy = todayISO();
          var batch = db.batch();
          batch.update(db.doc(negocioPath('motos')+'/'+moto.id), Object.assign({}, motoData, { depositoCorte: now }));
          batch.set(db.collection(negocioPath('movimientos')).doc(), {
            tipo:'deposito_liq', motoId:moto.id, motoPlaca:moto.placa, fecha:hoy, createdAt:now, cuenta: cuentaDeMoto(moto),
            monto: dev, retenido: ret, acumulado: dep.total, dias: dep.dias,
            arrendatarioNombre: moto.arrendatarioNombre||'', categoria:'Liquidación de depósito', nota: motivo
          });
          if(ret>0){
            batch.set(db.collection(negocioPath('movimientos')).doc(), {
              tipo:'ingreso', motoId:moto.id, motoPlaca:moto.placa, fecha:hoy, createdAt:now, cuenta: cuentaDeMoto(moto),
              monto: ret, categoria:'Depósito retenido', nota: motivo+(moto.arrendatarioNombre?(' · '+moto.arrendatarioNombre):''), fotoUrl:null
            });
          }
          var btn = sheet.querySelector('#ldSave'); btn.disabled = true;
          batch.commit().then(function(){
            closeSheet();
            showToast(ret>0 ? ('Depósito liquidado: se devuelven '+fmtMoney(dev)+', se retienen '+fmtMoney(ret)+'.') : ('Depósito liquidado: se devuelven '+fmtMoney(dev)+'.'));
          }).catch(function(e){ btn.disabled=false; showSaveError(e); });
        });
      }
    );
  }

  // Para rentas que empezaron antes de existir el depósito: pasa al depósito
  // los $5.000 de esos días. Como esos días ya se contaron como ingreso, se
  // registra un gasto "Traslado a depósito" por el mismo valor para no inflar el saldo.
  function openAjusteDeposito(m){
    var dias = diasSinDeposito(m);
    if(!dias.length) return;
    var monto = dias.length * DEPOSITO_DIARIO;
    askConfirm('Pasar días anteriores al depósito',
      escapeHtml(m.placa)+' tiene <b>'+dias.length+' día(s) pagados</b> en esta renta que se registraron antes del depósito. '
      + 'Se pasan <b>'+fmtMoney(monto)+'</b> al depósito ('+fmtMoney(DEPOSITO_DIARIO)+' por día).<br><br>'
      + 'Como esos días ya se contaron como ingreso, se anota un gasto "Traslado a depósito" de '+fmtMoney(monto)+' con fecha de hoy, para que tu saldo no cuente esa plata dos veces.',
      'Pasar al depósito', function(){
        var now = Date.now(), hoy = todayISO();
        var batch = db.batch();
        dias.forEach(function(r){
          batch.set(db.collection(negocioPath('movimientos')).doc(), { tipo:'deposito', motoId:m.id, motoPlaca:m.placa, fecha:r.fecha, createdAt:r.createdAt, cuenta: cuentaDeMoto(m),
            monto: DEPOSITO_DIARIO, categoria:'Depósito reembolsable', nota:'Pasado al depósito después (renta registrada antes del cambio)' });
        });
        batch.set(db.collection(negocioPath('movimientos')).doc(), { tipo:'gasto', motoId:m.id, motoPlaca:m.placa, fecha:hoy, createdAt:now, cuenta: cuentaDeMoto(m),
          monto: monto, categoria:'Traslado a depósito', nota: dias.length+' día(s) de la renta actual pasados al depósito reembolsable', fotoUrl:null });
        batch.commit().then(function(){ showToast(fmtMoney(monto)+' pasados al depósito de '+m.placa+'.'); setTimeout(function(){ openMotoDetail(m.id, true); }, 350); }).catch(showSaveError);
      }, function(){ openMotoDetail(m.id, true); });
  }

  function openMotoDetail(motoId, keepCalMonth){

    if(!keepCalMonth) calMonth = currentMonth;
    var st = computeMotoStats(motoId);
    var recentMovs = st.movs.filter(function(mv){ return mv.tipo==='ingreso' || mv.tipo==='gasto'; }).sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'');}).slice(0,10);
    var html = '<h2>'+escapeHtml(motoLabel(m))+'</h2>';
    if(cuentaDeMoto(m)) html += '<div class="banner">Moto de <b>'+escapeHtml(cuentaDeMoto(m))+'</b> · cuenta aparte. Sus pagos y gastos no se suman a RZ Rentas y no aparta nómina.</div>';

      + statRowTotal('Balance neto de esta moto', fmtMoney(st.balance), st.balance>=0?'pos':'neg')
      + (st.compra>0 ? statRow('Recuperación de la inversión', st.recuperado+'% ('+fmtMoney(st.compra-st.balance>0?st.compra-st.balance:0)+' por recuperar)') : '')

      + statRowTotal('Acumulado en esta renta', fmtMoney(dp.total), 'pos')
      + statRow('Días pagados que suman depósito', dp.dias+' día(s) × '+fmtMoney(DEPOSITO_DIARIO))
      + '</div>';
    html += '<div class="owner-only-note" style="margin-top:-6px;">Se devuelve al terminar la renta. Cuando pases la moto a "Disponible", la app te pide cuánto devolver y el acumulado vuelve a $0.</div>';
    if(sinDep.length){
      html += '<div class="warn-box"><b>'+sinDep.length+' día(s) de esta renta no tienen depósito</b>Se registraron antes de este cambio. <button class="pill muted" id="ajusteDep" style="cursor:pointer;border:none;margin-top:6px;">Pasar '+fmtMoney(sinDep.length*DEPOSITO_DIARIO)+' al depósito</button></div>';
    }
    if(liqs.length){
      html += '<div class="list" style="margin-bottom:10px;">' + liqs.slice(0,5).map(function(l){
        return '<div class="row-card"><div class="main"><div class="title">Liquidación '+fmtDate(l.fecha)+'</div>'
          + '<div class="meta">'+(l.arrendatarioNombre?escapeHtml(l.arrendatarioNombre)+' · ':'')+(l.dias||0)+' día(s) · acumulado '+fmtMoney(l.acumulado)
          + (Number(l.retenido)>0?(' · retenido '+fmtMoney(l.retenido)+(l.nota?(' ('+escapeHtml(l.nota)+')'):'')):'')+'</div></div>'
          + '<div class="amount">Devuelto '+fmtMoney(l.monto)+'</div></div>';
      }).join('') + '</div>';
    }
    if(m.arrendatarioNombre || m.arrendatarioTelefono || m.arrendatarioDocumento){
      var arrWa = waHrefTo(m.arrendatarioTelefono, 'Hola '+(m.arrendatarioNombre||'')+', te escribo de RZ Rentas sobre la moto '+m.placa+'.');
      html += '<div class="section-title" style="margin-top:18px;">Arrendatario actual</div>';
      html += '<div class="stat-list">'
        + (m.arrendatarioNombre ? statRow('Nombre', escapeHtml(m.arrendatarioNombre)) : '')
        + (m.arrendatarioDocumento ? statRow('Documento', escapeHtml(m.arrendatarioDocumento)) : '')
        + (m.arrendatarioTelefono ? statRow('Teléfono', escapeHtml(m.arrendatarioTelefono)) : '')
        + '</div>';
      if(arrWa){
        html += '<div class="sheet-actions" style="margin-top:6px;"><a class="btn primary" href="'+arrWa+'" target="_blank" rel="noopener" style="text-decoration:none; text-align:center;">Escribirle por WhatsApp</a></div>';
      }
    }
    html += '<div class="sheet-actions">'
      + '<button class="btn ghost" id="editMotoBtn">Editar moto</button>'
      + '<button class="btn primary" id="quickRenta">+ Renta de hoy</button>'
      + '</div>';
    html += '<div id="calWrap">'+renderMotoCalendar(motoId)+'</div>';
    html += '<div class="section-title" style="margin-top:20px;">Últimos movimientos de esta moto</div>';
    if(recentMovs.length===0){
      html += '<div class="empty">Sin movimientos registrados aún para esta moto.</div>';
    } else {
      html += '<div class="list">' + recentMovs.map(function(mv){
        return '<div class="row-card"><div class="main">'
          + '<div class="title">'+escapeHtml(mv.categoria||(mv.tipo==='ingreso'?'Ingreso':'Gasto'))+'</div>'
          + '<div class="meta">'+fmtDate(mv.fecha)+(mv.nota?(' · '+escapeHtml(mv.nota)):'')+'</div></div>'
          + '<div class="amount '+(mv.tipo==='ingreso'?'pos':'neg')+'">'+(mv.tipo==='ingreso'?'+':'-')+fmtMoney(mv.monto)+'</div>'
          + '</div>';

    html += '<div class="sheet-actions" style="margin-top:16px;"><button class="btn ghost" id="cancelSheet">Cerrar</button></div>';

      if(aj) aj.addEventListener('click', function(){ openAjusteDeposito(m); });

  // Conecta los botones del calendario. Al cambiar de mes solo se redibuja el
  // calendario (no toda la hoja), así no se pierde la posición en pantalla.
  function wireCalendar(sheet, m){
    var wrap = sheet.querySelector('#calWrap'); if(!wrap) return;
    wrap.querySelectorAll('[data-cal-month]').forEach(function(b){
      b.addEventListener('click', function(){
        var next = shiftMonth(calMonth||currentMonth, Number(b.getAttribute('data-cal-month')));
        if(next>currentMonth) return;
        calMonth = next;
        wrap.innerHTML = renderMotoCalendar(m.id);
        wireCalendar(sheet, m);
      });
    });
    wrap.querySelectorAll('[data-cal-pay]').forEach(function(cell){
      cell.addEventListener('click', function(){
        var iso = cell.getAttribute('data-cal-pay');
        askConfirm('Registrar pago atrasado',
          '¿Registrar la renta de <b>'+escapeHtml(m.placa)+'</b> del '+fmtDate(iso)+' por <b>'+fmtMoney(m.tarifaDiaria)+'</b>?',
          'Registrar pago', function(){
            registrarPagoRenta(m, iso, 'Pago atrasado registrado desde el calendario', function(){
              showToast('Pago del '+fmtDate(iso)+' registrado.');
              openMotoDetail(m.id, true);
            });
          }, function(){ openMotoDetail(m.id, true); });
      });
    });
    wrap.querySelectorAll('[data-cal-info]').forEach(function(cell){
      cell.addEventListener('click', function(){
        var row = wrap.querySelector('#pago-'+cell.getAttribute('data-cal-info'));
        if(row){
          row.scrollIntoView({behavior:'smooth', block:'center'});
          row.style.boxShadow = '0 0 0 2px var(--success) inset';
          setTimeout(function(){ row.style.boxShadow=''; }, 1600);
        }
      });
    });
  }
  function statRow(label, value, cls){
    return '<div class="stat-row"><div class="k">'+label+'</div><div class="v '+(cls||'')+'">'+value+'</div></div>';
  }
  function statRowTotal(label, value, cls){
    return '<div class="stat-row total"><div class="k">'+label+'</div><div class="v '+(cls||'')+'">'+value+'</div></div>';
  }

          h.hidden = false;
        }
        sheet.querySelector('#tMoto').addEventListener('change', mantHint); mantHint();
        var cancelBtn = sheet.querySelector('#cancelSheet');
        if(cancelBtn) cancelBtn.addEventListener('click', closeSheet);
        var delBtn = sheet.querySelector('#delMantDetail');
        if(delBtn) delBtn.addEventListener('click', function(){
          db.doc(negocioPath('mantenimientos')+'/'+existing.id).delete().then(closeSheet).catch(showSaveError);
        });
        sheet.querySelector('#saveMant').addEventListener('click', function(){
          var motoId = document.getElementById('tMoto').value;
          var moto = motoById(motoId);
          if(!moto){ showToast('Elige la moto.', true); return; }
          if(existing && cuentaDeMoto(moto)!==cuentaMant){ showToast('No se puede pasar un mantenimiento a una moto de otra cuenta.', true); return; }
          var data = {
            motoId: motoId, motoPlaca: moto?moto.placa:'', tipo: document.getElementById('tTipo').value,
            fecha: document.getElementById('tFecha').value||todayISO(),
            costo: parseMoney(document.getElementById('tCosto').value),
            proximoVencimiento: document.getElementById('tVence').value||null,
            notas: document.getElementById('tNotas').value||'',
            fotoUrl: photoField.get()||null,
            cuenta: cuentaDeMoto(moto)
          };
          if(existing){
            db.doc(negocioPath('mantenimientos')+'/'+existing.id).update(data).then(closeSheet).catch(showSaveError);
          } else {
            data.createdAt = Date.now();
            var dup = data.costo>0 && state.movimientos.find(function(mv){
              return mv.tipo==='gasto' && mv.motoId===data.motoId && Number(mv.monto||0)===data.costo && monthKey(mv.fecha)===monthKey(data.fecha);
            });
            var guardar = function(){ db.collection(negocioPath('mantenimientos')).add(data).then(closeSheet).catch(showSaveError); };
            if(dup){
              askConfirm('¿Ya está registrado?',
                'En Finanzas ya hay un gasto de <b>'+fmtMoney(dup.monto)+'</b> para '+escapeHtml(data.motoPlaca)+' ('+escapeHtml(dup.categoria||'Gasto')+', '+fmtDate(dup.fecha)+'). Si es el mismo, guardarlo aquí lo descontaría dos veces.',
                'Guardar de todos modos', guardar);
            } else guardar();
          }
        });
      }
    );
  }

  function openAlertaForm(){
    if(state.motos.length===0) return;
    var motoOpts = state.motos.map(function(m){return '<option value="'+m.id+'">'+escapeHtml(motoLabel(m))+'</option>';}).join('');
    openSheet(
      '<h2>Registrar alerta</h2>'
      + '<div class="field"><label>Moto</label><select id="aMoto">'+motoOpts+'</select></div>'
      + '<div class="field"><label>Tipo</label><select id="aTipo"><option value="zona">Salida de zona</option><option value="horario">Horario inusual</option><option value="otro">Otro</option></select></div>'
      + '<div class="field"><label>Fecha</label><input type="date" id="aFecha" value="'+todayISO()+'"></div>'
      + '<div class="field"><label>Descripción</label><textarea id="aDesc" placeholder="Qué avisó el rastreador"></textarea></div>'
      + '<div class="sheet-actions"><button class="btn ghost" id="cancelSheet">Cancelar</button><button class="btn primary" id="saveAlerta">Guardar</button></div>',
      function(sheet){
        sheet.querySelector('#cancelSheet').addEventListener('click', closeSheet);
        sheet.querySelector('#saveAlerta').addEventListener('click', function(){
          var motoId = document.getElementById('aMoto').value;
          var moto = motoById(motoId);
          db.collection(negocioPath('alertas')).add({
            motoId: motoId, motoPlaca: moto?moto.placa:'', tipo: document.getElementById('aTipo').value,
            fecha: document.getElementById('aFecha').value||todayISO(),
            descripcion: document.getElementById('aDesc').value||'', atendida:false, createdAt: Date.now()
          }).then(closeSheet).catch(showSaveError);
        });
      }
    );
  }

  function openRulesForm(motoId){
    var m = motoById(motoId); if(!m) return;
    openSheet(
      '<h2>Reglas GPS · '+escapeHtml(m.placa)+'</h2>'
      + '<div class="field"><label>Zona autorizada</label><input id="rZona" placeholder="Ej: perímetro urbano de Neiva" value="'+escapeHtml(m.zona||'')+'"></div>'
      + '<div class="two-col"><div class="field"><label>Hora inicio permitida</label><input type="time" id="rInicio" value="'+(m.horaInicio||'06:00')+'"></div>'
      + '<div class="field"><label>Hora fin permitida</label><input type="time" id="rFin" value="'+(m.horaFin||'21:00')+'"></div></div>'
      + '<div class="sheet-actions"><button class="btn ghost" id="cancelSheet">Cancelar</button><button class="btn primary" id="saveRules">Guardar</button></div>',
      function(sheet){
        sheet.querySelector('#cancelSheet').addEventListener('click', closeSheet);
        sheet.querySelector('#saveRules').addEventListener('click', function(){
          db.doc(negocioPath('motos')+'/'+motoId).update({
            zona: document.getElementById('rZona').value||'',
            horaInicio: document.getElementById('rInicio').value||'',
            horaFin: document.getElementById('rFin').value||''
          }).then(closeSheet).catch(showSaveError);
        });
      }
    );
  }

  // ---------- events ----------
  function wireView(){
    var reiniciarNominaBtn = document.getElementById('reiniciarNomina');
    if(reiniciarNominaBtn){
      reiniciarNominaBtn.addEventListener('click', function(){
        if(!isOwnerView) return;
        var monto = nominaAcumulada();
        if(monto<=0){ showToast('No hay nómina acumulada para reiniciar.'); return; }
        askConfirm('Reiniciar nómina',
          '¿Ya pagaste <b>'+fmtMoney(monto)+'</b> de nómina/administración? El contador vuelve a $0.<br><br>No registres este pago como gasto en Finanzas: ese dinero ya se apartó de cada renta, y se descontaría dos veces.',
          'Sí, ya la pagué', function(){
            db.doc(negocioPath('config')+'/nomina').set({ ultimoReinicio: Date.now() }, { merge: true })
              .then(function(){ showToast('Nómina reiniciada a $0.'); }).catch(showSaveError);
          });
      });
    }
    document.querySelectorAll('[data-del-mov]').forEach(function(b){
      b.addEventListener('click', function(){
        if(!isOwnerView) return;
        var id = b.getAttribute('data-del-mov');
        var mov = state.movimientos.find(function(m){return m.id===id;});
        if(!mov) return;
        // Si es una renta, también se borra su parte de nómina (se crearon juntas).
        // Antes quedaba "huérfana" y la nómina acumulada mostraba de más.
        var parejas = (mov.tipo==='ingreso' && mov.categoria==='Renta') ? state.movimientos.filter(function(m){
          return (m.tipo==='nomina' || m.tipo==='deposito') && m.motoId===mov.motoId && m.fecha===mov.fecha && m.createdAt===mov.createdAt;
        }) : [];
        var extraTxt = parejas.map(function(pm){ return fmtMoney(pm.monto)+' de '+(pm.tipo==='nomina'?'nómina':'depósito'); }).join(' y ');
        askConfirm('Eliminar movimiento',
          escapeHtml(mov.categoria||'Movimiento')+' de <b>'+fmtMoney(mov.monto)+'</b> del '+fmtDate(mov.fecha)+'.'+(parejas.length?(' También se borran los '+extraTxt+' de esa renta.'):''),
          'Eliminar', function(){
            var batch = db.batch();
            batch.delete(db.doc(negocioPath('movimientos')+'/'+id));
            parejas.forEach(function(pm){ batch.delete(db.doc(negocioPath('movimientos')+'/'+pm.id)); });
            batch.commit().catch(showSaveError);
          });
      });
    });
    document.querySelectorAll('[data-edit-mov]').forEach(function(b){
      b.addEventListener('click', function(){
        if(!isOwnerView) return;
        var mov = state.movimientos.find(function(m){return m.id===b.getAttribute('data-edit-mov');});
        if(mov) openMovForm(mov);
      });
    });
    document.querySelectorAll('[data-view-photo-mov]').forEach(function(b){
      b.addEventListener('click', function(){
        var mov = state.movimientos.find(function(m){return m.id===b.getAttribute('data-view-photo-mov');});
        if(mov) openImageLightbox(mov.fotoUrl);
      });
    });
    document.querySelectorAll('[data-del-moto]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var id = b.getAttribute('data-del-moto'), m = motoById(id);
        if(!m) return;
        var c = cuentaDeMoto(m);
        askConfirm('Eliminar moto',
          '¿Eliminar la moto <b>'+escapeHtml(m.placa)+'</b>? Sus rentas y gastos ya registrados se conservan y siguen contando en la cuenta de <b>'+escapeHtml(nombreCuenta(c))+'</b>.',
          'Eliminar', function(){
            // Antes de borrar la moto se le graba la cuenta a cada registro suyo,
            // para que su historia siga en la misma cuenta y nunca pase a la otra.
            var refs = [];
            state.movimientos.forEach(function(mv){ if(mv.motoId===id && (mv.cuenta||'')!==c) refs.push(db.doc(negocioPath('movimientos')+'/'+mv.id)); });
            state.mantenimientos.forEach(function(mt){ if(mt.motoId===id && (mt.cuenta||'')!==c) refs.push(db.doc(negocioPath('mantenimientos')+'/'+mt.id)); });
            var recs = state.recurrentes.filter(function(r){ return r.motoId!==id; });
            var tandas = [];
            for(var i=0;i<refs.length;i+=400) tandas.push(refs.slice(i,i+400));
            var p = Promise.resolve();
            tandas.forEach(function(t){ p = p.then(function(){ var bt = db.batch(); t.forEach(function(r){ bt.update(r, { cuenta: c }); }); return bt.commit(); }); });
            p.then(function(){ return recs.length!==state.recurrentes.length ? db.doc(negocioPath('config')+'/recurrentes').set({ items: recs, updatedAt: Date.now() }) : null; })
             .then(function(){ return db.doc(negocioPath('motos')+'/'+id).delete(); })
             .then(function(){ showToast('Moto '+m.placa+' eliminada. Su historia sigue en la cuenta de '+nombreCuenta(c)+'.'); })
             .catch(showSaveError);
          });
      });
    });
    document.querySelectorAll('[data-open-moto]').forEach(function(row){
      row.addEventListener('click', function(){ openMotoDetail(row.getAttribute('data-open-moto')); });
    });
    document.querySelectorAll('[data-open-mant]').forEach(function(row){
      row.addEventListener('click', function(){
        var mt = state.mantenimientos.find(function(x){return x.id===row.getAttribute('data-open-mant');});
        if(mt) openMantForm(mt);
      });
    });
    document.querySelectorAll('[data-del-mant]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var id = b.getAttribute('data-del-mant');
        var mt = state.mantenimientos.find(function(x){return x.id===id;});
        askConfirm('Eliminar mantenimiento',
          (mt?(escapeHtml(mt.motoPlaca||'')+' · '+escapeHtml(mt.tipo||'')+(mt.costo?(' de <b>'+fmtMoney(mt.costo)+'</b>'):'')+' del '+fmtDate(mt.fecha)+'.'):'¿Eliminar este registro?'),
          'Eliminar', function(){ db.doc(negocioPath('mantenimientos')+'/'+id).delete().catch(showSaveError); });
      });
    });
    document.querySelectorAll('[data-del-alerta]').forEach(function(b){
      b.addEventListener('click', function(){ db.doc(negocioPath('alertas')+'/'+b.getAttribute('data-del-alerta')).delete().catch(showSaveError); });
    });
    document.querySelectorAll('[data-toggle-alerta]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-toggle-alerta');
        var a = state.alertas.find(function(x){return x.id===id;});
        if(a) db.doc(negocioPath('alertas')+'/'+id).update({atendida: !a.atendida}).catch(showSaveError);
      });
    });
    document.querySelectorAll('[data-motofilter]').forEach(function(b){
      b.addEventListener('click', function(){ state.motoFilter = b.getAttribute('data-motofilter'); render(); });
    });
    document.querySelectorAll('[data-editrules]').forEach(function(b){
      b.addEventListener('click', function(){ openRulesForm(b.getAttribute('data-editrules')); });
    });
    document.querySelectorAll('[data-flag-mov]').forEach(function(b){
      b.addEventListener('click', function(e){ e.stopPropagation(); openFlagForm(b.getAttribute('data-flag-mov'), b.getAttribute('data-flag-placa')); });
    });
    document.querySelectorAll('[data-unflag-mov]').forEach(function(b){
      b.addEventListener('click', function(){ db.doc(negocioPath('supervision')+'/'+b.getAttribute('data-unflag-mov')).delete().catch(showSaveError); });
    });
    var recAdmin = document.getElementById('recAdmin');
    if(recAdmin) recAdmin.addEventListener('click', openAdminRecurrentes);
    document.querySelectorAll('[data-rec-pagar]').forEach(function(b){
      b.addEventListener('click', function(){
        var r = state.recurrentes.find(function(x){return x.id===b.getAttribute('data-rec-pagar');});
        if(r) openPagarRecurrente(r, state.viewMonth);
      });
    });
    var recTodos = document.getElementById('recPagarTodos');
    if(recTodos) recTodos.addEventListener('click', function(){
      var mk = state.viewMonth;
      var pend = recurrentesDelMes(mk, state.cuenta||'').filter(function(x){return !x.pago;});
      var total = pend.reduce(function(a,x){return a+Number(x.rec.monto||0);},0);
      askConfirm('Registrar gastos fijos',
        'Se registran <b>'+pend.length+'</b> gastos por un total de <b>'+fmtMoney(total)+'</b>, cada uno con su valor configurado:<br>'
          + pend.map(function(x){return '· '+escapeHtml(x.moto?x.moto.placa:'General')+' — '+escapeHtml(x.rec.nombre)+': '+fmtMoney(x.rec.monto);}).join('<br>'),
        'Registrar todos', function(){
          var batch = db.batch();
          pend.forEach(function(x){
            var ref = db.collection(negocioPath('movimientos')).doc();
            batch.set(ref, { tipo:'gasto', monto:Number(x.rec.monto||0), categoria:x.rec.categoria||'Seguros (SOAT/todo riesgo)',
              motoId:x.rec.motoId||null, motoPlaca:x.moto?x.moto.placa:null, fecha:x.fechaReg,
              nota:x.rec.nombre+' — '+new Date(mk+'-02').toLocaleDateString('es-CO',{month:'long',year:'numeric'}), fotoUrl:null,
              recurrenteId:x.rec.id, recurrenteMes:mk, createdAt:Date.now(), cuenta: cuentaDeMotoId(x.rec.motoId) });
          });
          batch.commit().then(function(){ showToast(pend.length+' gastos fijos registrados.'); }).catch(showSaveError);
        });
    });
    document.querySelectorAll('[data-cuenta]').forEach(function(b){
      b.addEventListener('click', function(){ state.cuenta = b.getAttribute('data-cuenta'); render(); });
    });
    document.querySelectorAll('[data-go-cuenta]').forEach(function(b){
      b.addEventListener('click', function(){
        state.cuenta = b.getAttribute('data-go-cuenta');
        state.tab = 'finanzas';
        document.querySelectorAll('#tabbar button').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-tab')==='finanzas'); });
        render();
      });
    });
    var goRec = document.getElementById('goRecurrentes');
    if(goRec) goRec.addEventListener('click', function(){
      state.cuenta = '';
      state.tab = 'finanzas';
      document.querySelectorAll('#tabbar button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-tab')==='finanzas'); });
      render();
    });
    document.querySelectorAll('[data-month-nav]').forEach(function(b){
      b.addEventListener('click', function(){
        var delta = Number(b.getAttribute('data-month-nav'));
        var next = shiftMonth(state.viewMonth, delta);
        if(next>currentMonth) return; // no navegar a meses futuros
        state.viewMonth = next; render();
      });
    });
  }

  document.getElementById('tabbar').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-tab]');
    if(!btn) return;
    document.querySelectorAll('#tabbar button').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    state.tab = btn.getAttribute('data-tab');
    render();
  });

  // ---------- boot ----------
  function subscribe(name, key){
    var un = db.collection(negocioPath(name)).onSnapshot(function(snap){
      state[key] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(err){
      console.error(name, err);
      showToast('No se pudo leer "' + name + '": ' + (err && err.message ? err.message : String(err)), true);
    });
    unsubs.push(un);
  }

  function boot(){
    subscribe('motos','motos');
    subscribe('movimientos','movimientos');
    subscribe('mantenimientos','mantenimientos');
    subscribe('alertas','alertas');
    subscribeNominaConfig();
    subscribeRecurrentes();
    if(isOwnerView) subscribe('supervision','supervision');
    var existingSupBtn = document.querySelector('#tabbar button[data-tab="supervision"]');
    if(isOwnerView && !existingSupBtn){
      var tpl = document.getElementById('tplSupervisionTab');
      if(tpl) document.getElementById('tabbar').appendChild(tpl.content.cloneNode(true));
    }
    if(!isOwnerView && existingSupBtn) existingSupBtn.remove();
    document.getElementById('tabbar').style.gridTemplateColumns = isOwnerView ? 'repeat(6,1fr)' : '';
    render();
  }

  // Deja la app lista para que otra persona inicie sesión: cierra las
  // suscripciones en vivo del negocio anterior y limpia lo que se ve en pantalla.
  function teardownApp(){
    unsubs.forEach(function(u){ u(); }); unsubs = [];
    state = { motos: [], movimientos: [], mantenimientos: [], alertas: [], supervision: [], tab: 'resumen', motoFilter: 'todas', viewMonth: currentMonth, nominaConfig: { ultimoReinicio: 0 }, recurrentes: [] };
    var supBtn = document.querySelector('#tabbar button[data-tab="supervision"]');
    if(supBtn) supBtn.remove();
  }

  // ---------- login / sesión (Firebase Authentication) ----------
  // El "código del negocio" + el rol elegido arman un correo interno único, p.ej.
  // "rzrentas.dueno@rzcontrol.app" — no es un correo real que reciba nada, es solo
  // la forma en que Firebase Authentication identifica esa cuenta. La CLAVE sí es
  // real y es la que tú defines al crear cada cuenta desde la consola de Firebase.
  var auth = firebase.auth();
  db = firebase.firestore();

  function emailFor(negocio, rol){
    return negocio.trim().toLowerCase().replace(/[^a-z0-9]/g,'') + '.' + rol + '@rzcontrol.app';
  }

  document.getElementById('loginRolSeg').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-v]');
    if(!btn) return;
    document.querySelectorAll('#loginRolSeg button').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
  });

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var negocio = document.getElementById('loginNegocio').value;
    var rol = document.querySelector('#loginRolSeg button.active').getAttribute('data-v');
    var clave = document.getElementById('loginClave').value;
    var errEl = document.getElementById('loginError');
    errEl.textContent = '';
    if(!negocio.trim() || !clave){ errEl.textContent = 'Completa el código del negocio y la clave.'; return; }
    var submitBtn = document.getElementById('loginSubmit');
    submitBtn.disabled = true; submitBtn.textContent = 'Entrando…';
    auth.signInWithEmailAndPassword(emailFor(negocio, rol), clave)
      .catch(function(err){
        errEl.textContent = (err && (err.code==='auth/invalid-credential' || err.code==='auth/wrong-password' || err.code==='auth/user-not-found'))
          ? 'Código de negocio, rol o clave incorrectos.'
          : 'No se pudo iniciar sesión (' + (err && err.code || 'error') + ').';
      })
      .finally(function(){
        submitBtn.disabled = false; submitBtn.textContent = 'Entrar';
      });
  });

  // ---------- cambiar clave del dueño ----------
  // Firebase exige confirmar la clave actual antes de cambiarla (así nadie que
  // encuentre la app abierta puede cambiarla sin saber la clave).
  function openCambiarClave(){
    if(!isOwnerView) return;
    openSheet(
      '<h2>Cambiar clave del dueño</h2>'
      + '<div class="owner-only-note">Usa al menos 6 caracteres. La nueva clave aplica en todos los dispositivos donde entres como Dueño.</div>'
      + '<div class="field"><label for="ckActual">Clave actual</label><input id="ckActual" type="password" autocomplete="current-password"></div>'
      + '<div class="field"><label for="ckNueva">Clave nueva</label><input id="ckNueva" type="password" autocomplete="new-password"></div>'
      + '<div class="field"><label for="ckNueva2">Repite la clave nueva</label><input id="ckNueva2" type="password" autocomplete="new-password"></div>'
      + '<div class="field-error" id="ckErr" hidden></div>'
      + '<div class="sheet-actions"><button class="btn ghost" id="cancelSheet">Cancelar</button><button class="btn primary" id="ckSave">Cambiar clave</button></div>',
      function(sheet){
        sheet.querySelector('#cancelSheet').addEventListener('click', closeSheet);
        var err = sheet.querySelector('#ckErr');
        function fail(msg){ err.textContent = msg; err.hidden = false; }
        sheet.querySelector('#ckSave').addEventListener('click', function(){
          var actual = sheet.querySelector('#ckActual').value;
          var nueva = sheet.querySelector('#ckNueva').value;
          var nueva2 = sheet.querySelector('#ckNueva2').value;
          err.hidden = true;
          if(!actual) return fail('Escribe tu clave actual.');
          if(nueva.length < 6) return fail('La clave nueva debe tener al menos 6 caracteres.');
          if(nueva !== nueva2) return fail('Las dos claves nuevas no coinciden.');
          if(nueva === actual) return fail('La clave nueva es igual a la actual.');
          var user = auth.currentUser;
          if(!user) return fail('La sesión se cerró. Vuelve a entrar e inténtalo de nuevo.');
          var btn = sheet.querySelector('#ckSave');
          btn.disabled = true; btn.textContent = 'Cambiando…';
          var cred = firebase.auth.EmailAuthProvider.credential(user.email, actual);
          user.reauthenticateWithCredential(cred)
            .then(function(){ return user.updatePassword(nueva); })
            .then(function(){ closeSheet(); showToast('Clave cambiada. Úsala la próxima vez que entres como Dueño.'); })
            .catch(function(e){
              var c = e && e.code;
              if(c==='auth/wrong-password' || c==='auth/invalid-credential' || c==='auth/invalid-login-credentials') fail('La clave actual no es correcta.');
              else if(c==='auth/weak-password') fail('Esa clave es muy débil. Usa una más larga.');
              else if(c==='auth/too-many-requests') fail('Demasiados intentos. Espera unos minutos y vuelve a intentar.');
              else if(c==='auth/network-request-failed') fail('Sin conexión a internet. Revisa la señal e inténtalo de nuevo.');
              else fail('No se pudo cambiar la clave ('+(c||'error')+').');
            })
            .finally(function(){ btn.disabled = false; btn.textContent = 'Cambiar clave'; });
        });
      }
    );
  }
  document.getElementById('claveBtn').addEventListener('click', openCambiarClave);

  document.getElementById('logoutBtn').addEventListener('click', function(){
    auth.signOut();
  });

  auth.onAuthStateChanged(function(user){
    if(!user){
      teardownApp();
      document.getElementById('app').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('loginClave').value = '';
      return;
    }
    // El correo interno es "<negocioId>.<rol>@rzcontrol.app" — de ahí sacamos
    // ambos datos en vez de guardarlos aparte.
    var email = user.email || '';
    var parts = email.split('@')[0].split('.');
    negocioId = parts[0] || 'default';
    isOwnerView = parts[1] === 'dueno';
    document.getElementById('claveBtn').hidden = !isOwnerView;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = '';
    boot();
  });
})();
</script>
